function hostHello(cid,m){const T=Online.tr;
  const recusa=txt=>{T.paraCliente(cid,{t:'recusa',motivo:txt});setTimeout(()=>T.expulsar(cid),400);};
  if(!m||m.v!==PROTO)return recusa('Versão do jogo diferente da do anfitrião: atualize a página (Ctrl+F5) e tente de novo.');
  let nome=limparNome(m.nome);const voc=VOCS.includes(m.voc)?m.voc:'knight',tk=String(m.tk||'');
  if(Online.emJogo){   // partida em andamento: só retoma a vaga de quem caiu (mesmo nome) ou do mesmo navegador (mesmo token)
    const chave=nome.toLowerCase();
    const velhoCid=Object.keys(Online.clientes).find(k=>k!==cid&&Online.clientes[k].p&&Online.clientes[k].p.nome.toLowerCase()===chave);
    let p=null;
    if(velhoCid){if(tk&&Online.clientes[velhoCid].tk===tk){p=Online.clientes[velhoCid].p;const antigo=velhoCid;delete Online.clientes[antigo];T.expulsar(antigo);}else return recusa('Já existe um jogador com esse nome na partida.');}
    else p=G.jog.find(q=>q.eraHumano&&!q.humano&&(q.nome.toLowerCase()===chave||(tk&&q.tk===tk)));
    if(!p)return recusa('Partida em andamento: não há vaga reservada para esse nome.');
    p.humano=true;p.remoto=true;p.cid=cid;p.pronto=false;p.tk=tk;
    const cl={cid,nome:p.nome,voc:p.voc,p,tk,ult:agoraMs(),ack:0,cnt:0,cntT:0};Online.clientes[cid]=cl;
    T.paraCliente(cid,{t:'ola',id:p.id,retomou:true});T.paraCliente(cid,{t:'inicio',id:p.id});
    enviarSnapCl(cl,'rodada',{opo:G.opoDe[p.id]===undefined?-1:G.opoDe[p.id],opoEq:G.opoEq[p.id]||[]});
    const f=G.lutas[p.id];if(G.fase==='combate'&&f)enviarLuta(cl,f);
    avisarTodos(p.nome+' voltou à partida');marcar('jog');return;}
  if(Online.sala.length>=8)return recusa('Sala cheia (8 jogadores).');
  const base=nome;let k=1;while(Online.sala.some(x=>x.nome.toLowerCase()===nome.toLowerCase()))nome=base.slice(0,13)+' '+(++k);
  Online.clientes[cid]={cid,nome,voc,p:null,tk,ult:agoraMs(),ack:0,cnt:0,cntT:0};Online.sala.push({cid,nome,voc,host:false});
  T.paraCliente(cid,{t:'ola',id:-1,nome});lobbyEnviar();}

  if(!Online.emJogo){Online.sala=Online.sala.filter(x=>x.cid!==cid);lobbyEnviar();return;}
  const p=cl.p;if(p&&p.cid===cid&&p.humano){virarBot(G,p);avisarTodos(p.nome+' saiu da partida: um bot assumiu a vaga');marcar('jog');
    if(UI.fase==='prep'&&G.info.tipo==='car')abrirCarrosselUI();}}

  const me=UI.jog;pubAplicar(m.jog);
  G.rodada=m.rodada;G.fase=m.fase;G.info=m.info;G.fim=m.fim;
  G.car=m.car?{itens:m.car.itens.slice(),ordem:m.car.ordem.map(i=>G.jog[i]),idx:m.car.idx,esc:m.car.esc||{}}:null;
  if(m.t!=='snap'||m.force||m.ack>=Online.cmdN)privAplicar(me,m.eu);     // com comandos otimistas ainda sem resposta, espera o snapshot seguinte
  let mx=0;todos(me).forEach(L=>{if(L.inst.uid>mx)mx=L.inst.uid;});G.uid=Math.max(G.uid,mx);
  UI.prevSujo=true;marcarTudo();
  if(m.t==='rodada'){guestRodada(m);}
  else if(m.t==='res'){guestRes(m);}
  else if(G.info.tipo==='car'&&UI.fase==='prep')abrirCarrosselUI();}
function guestRodada(m){const me=UI.jog;G.opoDe={};G.opoDe[me.id]=m.opo;G.opoEq={};G.opoEq[me.id]=m.opoEq||[];UI.acabou=false;
  if(m.fase==='prep'){iniciarPrepUI();UI.timerMax=m.tmax;UI.timer=m.tempo/1000;}
  else{UI.fase='espera';UI.C=null;UI.prev=null;marcarTudo();}}
function guestLuta(m){if(UI.estado!=='fim')fecharTela();G.fase='combate';UI.fase='combate';
  const C=criarCombate(eqDes(m.A),eqDes(m.B),{vis:true,seed:m.seed,pve:m.pve});C.esp=m.lado===1;
  UI.C=C;UI.acc=0;UI.fimEm=0;UI.prev=null;Online.lutasVistas++;marcar('jog','btn','topo');
  banner('Combate',m.pve?'Estágio '+m.nome+' · Monstros':'Estágio '+m.nome+' · vs '+m.vs,'#e0574a',1300,true);}
function guestRes(m){if(UI.estado!=='fim')fecharTela();
  // o anfitrião decide: se a nossa animação ainda não acabou, termina agora (e confere se bate com o resultado oficial)
  const C=UI.C;if(C&&!C.fim){let n=0;while(!C.fim&&n++<2000)passo(C);}
  if(C&&m.cmb&&(C.venc!==m.cmb.v||C.t!==m.cmb.t)){Online.dessinc++;console.warn('Dessincronia na luta: local',C.venc,C.t,'oficial',m.cmb.v,m.cmb.t);}
  UI.fase='resultado';UI.prevSujo=false;UI.prev=null;UI.resEm=m.resMs||3300;UI.acabou=!!m.acabou;
  const d=m.desc;banner(d.t,d.s,d.cor,3000);if(d.sm)$('faixa').insertAdjacentHTML('beforeend','<small>'+d.sm+'</small>');}

/* =====================================================================================
   Telas do online: entrar/criar sala, lobby, falhas
   ===================================================================================== */
function msgOnline(t){const e=$('on-msg');if(e)e.textContent=t;}
function onlineFalha(msg){const volta=UI.estado!=='menu';onlineSair();if(volta&&G){G=null;UI.jog=null;UI.C=null;UI.prev=null;mostrarMenu();}
  telaHTML(`<div class="painel modal" style="width:min(460px,94vw)"><h2>Conexão</h2><div class="txt" style="text-align:center">${esc(msg)}</div><div class="menu" style="margin-top:16px"><button class="bt primario" id="b-ok">Menu principal</button></div></div>`);
  $('tela').classList.add('menu');$('b-ok').onclick=()=>mostrarMenu();}
function htmlHerois(){return `<div class="herois">${VOCS.map(v=>`<div class="heroi ${UI.voc===v?'sel':''}" data-v="${v}"><canvas width="56" height="56" data-av="${v}"></canvas>${{knight:'Knight',paladin:'Paladin',sorcerer:'Sorcerer',druid:'Druid'}[v]}</div>`).join('')}</div>`;}
function ligarHerois(){document.querySelectorAll('.heroi').forEach(el=>el.onclick=()=>{UI.voc=el.dataset.v;document.querySelectorAll('.heroi').forEach(e=>e.classList.toggle('sel',e===el));});}
function mostrarOnline(codPre){Online.tela='online';const local=MODO_REDE==='local';
  telaHTML(`<div class="painel modal"><h2>Jogar online</h2>
    <div class="txt" style="text-align:center">Crie uma sala e passe o código aos amigos, ou entre numa sala com o código. O anfitrião inicia a partida (2 a 8 jogadores); as vagas que sobrarem viram bots.</div>
    ${local?'<div class="aviso-modo">Modo de teste local (BroadcastChannel): funciona entre abas deste navegador, sem internet.</div>':''}
    <div class="campo"><label for="i-nome">Seu nome</label><input id="i-nome" maxlength="16" autocomplete="off" value="${esc(lerNome())}" placeholder="Nome do jogador"></div>
    ${htmlHerois()}
    <div class="menu"><button class="bt primario" id="b-criar">Criar sala</button>
      <div class="linha"><input id="i-cod" maxlength="4" autocomplete="off" placeholder="CÓDIGO" value="${esc(codPre||'')}"><button class="bt" id="b-entrar">Entrar</button></div>
      <button class="bt" id="b-v">Voltar</button></div>
    <div class="msgerro" id="on-msg"></div></div>`);
  $('tela').classList.add('menu');retratosPend();ligarHerois();
  const nome=()=>{const n=limparNome($('i-nome').value);gravarNome(n);return n;};
  $('b-criar').onclick=()=>onlineCriarSala(nome(),UI.voc);
  $('b-entrar').onclick=()=>onlineEntrar($('i-cod').value,nome(),UI.voc);
  $('i-cod').addEventListener('keydown',e=>{if(e.key==='Enter')$('b-entrar').click();});
  $('b-v').onclick=()=>{Online.tela='';mostrarMenu();};}
function mostrarLobby(){Online.tela='lobby';const h=Online.host,n=Online.sala.length;
  const url=(location.href.split('#')[0].split('?')[0])+'?sala='+Online.codigo+(MODO_REDE==='local'?'&rede=local':'');
  const linhas=Online.sala.map(x=>`<div class="lob"><div class="av"><canvas width="38" height="38" data-av="${x.voc}"></canvas></div><span class="nm">${esc(x.nome)}</span>${x.host?'<em>Anfitrião</em>':''}</div>`).join('')+
    Array.from({length:Math.max(0,Math.min(8,Math.max(n,4))-n)},()=>'<div class="lob vaga"><div class="av"></div><span class="nm">vaga livre</span></div>').join('');
  telaHTML(`<div class="painel modal" style="width:min(520px,94vw)"><div class="sub" style="margin-bottom:0">Código da sala</div><div class="codigo" id="cod-sala">${esc(Online.codigo)}</div>
    <div class="txt" style="text-align:center;margin-bottom:10px">${h?'Passe o código (ou o link) aos amigos. Quando todos entrarem, inicie a partida.':'Você entrou na sala. Aguardando o anfitrião iniciar a partida.'}</div>
    <div style="margin-bottom:12px">${linhas}</div>
    <div class="menu">${h?`<button class="bt primario" id="b-ini" ${n<2?'disabled':''}>Iniciar partida (${n}/8)</button><button class="bt" id="b-link">Copiar link da sala</button>`:'<div class="vazio" style="text-align:center">Aguardando o anfitrião...</div>'}
      <button class="bt" id="b-sair">Sair da sala</button></div>
    <div class="msgerro" id="on-msg">${h&&n<2?'São necessários pelo menos 2 jogadores.':''}</div></div>`);
  $('tela').classList.add('menu');retratosPend();
  if(h){$('b-ini').onclick=onlineIniciar;
    $('b-link').onclick=()=>{try{navigator.clipboard.writeText(url).then(()=>{$('b-link').textContent='Link copiado!';},()=>{msgOnline(url);});}catch(e){msgOnline(url);}};}
  $('b-sair').onclick=()=>{if(Online.guest&&Online.tr)Online.tr.paraHost({t:'bye'});voltarMenu();};}

/* =====================================================================================
   Laço principal
   ===================================================================================== */
function laco(ts){requestAnimationFrame(laco);const dt=Math.min(100,ts-(UI.ultT||ts));UI.ultT=ts;
  const pausa=UI.pausado&&!Online.ativo;       // online não pausa
  if(UI.C&&!pausa&&(UI.demo||UI.estado==='jogo'&&UI.fase==='combate')){
    UI.acc=Math.min(UI.acc+dt*(UI.demo?1:UI.vel),500);while(UI.acc>=100&&!UI.C.fim){passo(UI.C);UI.acc-=100;}
    if(UI.C.fim){UI.acc=0;UI.fimEm+=dt;if(UI.demo){if(UI.fimEm>2500)iniciarDemo();}else if(UI.fimEm>1500&&!Online.ativo)finalizarRodadaUI();}}
  else if(UI.estado==='jogo'&&!pausa){
    if(UI.fase==='prep'&&Online.host){}      // o relógio do anfitrião roda em tiqueHost (setInterval)
    else if(UI.fase==='prep'){UI.timer-=dt/1000;if(UI.timer<=0&&Online.guest)UI.timer=0;else if(UI.timer<=0){if(G.info.tipo==='car'&&!carPronto(G)){let bi=0,bs=-1;G.car.itens.forEach((id,i)=>{if(ITEM[id].t>bs){bs=ITEM[id].t;bi=i;}});carEscolher(G,bi);fecharTela();marcar('itens');}pronto(true);}}
    else if(UI.fase==='resultado'&&!Online.host){UI.resEm-=dt;if(UI.resEm<=0){UI.fase='fila';proximaRodadaUI();}}}
  if(UI.estado==='jogo'){atualizarSujos();hudTempo();}
  // retratos animados das cartas
  if(UI.estado==='jogo'&&ts-(UI.ultRet||0)>130){UI.ultRet=ts;document.querySelectorAll('.carta canvas[data-ret]').forEach(c=>pintarRetrato(c,c.dataset.ret,ts));}
  render();}

/* =====================================================================================
   Inicialização
   ===================================================================================== */
function iniciar(){cv=$('cv');cx=cv.getContext('2d');ajustarCanvas();addEventListener('resize',ajustarCanvas);
  cv.addEventListener('pointerdown',pointerDownCv);$('grade-itens').addEventListener('pointerdown',pointerDownItem);
  addEventListener('pointermove',pointerMove);addEventListener('pointerup',pointerUp);addEventListener('keydown',teclado);
  cv.addEventListener('pointerleave',()=>{if(!UI.drag){esconderTip();UI.hoverCel=null;UI.hover=null;}});
  document.body.addEventListener('pointerleave',esconderTip);
  $('cartas').addEventListener('click',e=>{const c=e.target.closest('.carta');if(c&&!c.classList.contains('vend'))comprarUI(+c.dataset.i);});
  $('bt-rolar').onclick=rolarUI;$('bt-xp').onclick=xpUI;$('bt-trava').onclick=travarUI;$('bt-pronto').onclick=()=>pronto();$('bt-vel').onclick=alternarVel;$('bt-menu').onclick=pausar;$('logo').onclick=()=>{if(UI.estado==='jogo')pausar();};
  addEventListener('contextmenu',e=>{if(e.target===cv)e.preventDefault();});
  addEventListener('pagehide',()=>{if(Online.ativo&&Online.tr){try{if(Online.guest)Online.tr.paraHost({t:'bye'});Online.tr.fechar();}catch(e){}}});
  $('app').style.visibility='hidden';
  telaHTML('<div class="painel modal"><h1>Tibia Tactics</h1><div class="sub">Carregando sprites</div><div class="prog"><div class="barra"><i id="prog-b" style="width:0%"></i></div></div></div>');
  UI.demo=true;
  precarregar(f=>{const b=$('prog-b');if(b)b.style.width=Math.round(f*100)+'%';}).then(()=>{ajustarCanvas();mostrarMenu();
    const sala=new URLSearchParams(location.search).get('sala');if(sala)mostrarOnline(sala);});   // link de convite: ?sala=CODIGO
  requestAnimationFrame(laco);}


/* ---- ponto de entrada: ?sim=N roda N partidas bot x bot sem render; senão, abre o jogo ---- */
(function(){
  if(typeof document==='undefined')return;                       // testes headless: só expõe o motor
  const q=new URLSearchParams(location.search);
  if(q.has('sim')){const N=Math.max(1,+q.get('sim')||20);document.body.style.overflow='auto';
    document.body.innerHTML='<pre id="sim" style="padding:14px;color:#cfc9b4;font:12px monospace">Simulando '+N+' partidas...</pre>';
    setTimeout(()=>{const R=simularLote(N,+q.get('seed')||1),txt=relatorioLote(R);console.log(txt);console.table(Object.fromEntries(Object.entries(R.tr).map(([k,o])=>[k,{lutas:o.n,vitoria:(100*o.w/o.n).toFixed(1)+'%'}])));
      document.getElementById('sim').textContent=txt+(R.msgErros.length?'\n\nERROS:\n'+R.msgErros.join('\n'):'');},30);return;}
  iniciar();
})();

</script>
