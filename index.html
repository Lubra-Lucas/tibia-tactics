<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="versao-site" content="2026-10-16.1"><!-- a cada deploy: trocar aqui, em VERSAO_SITE e nos ?v= dos scripts locais -->
<script id="auto-update">
/* auto-atualização: o GitHub Pages cacheia 10 min; compara a versão do index no servidor com a desta página e recarrega se mudou */
(function(){
  const RE=/<meta\s+name=["']versao-site["']\s+content=["']([^"']+)["']/i;
  const novaUrl=(loc,nova)=>{const q=new URLSearchParams(loc.search);q.delete('nc');q.set('v',nova);return loc.pathname+'?'+q.toString()+loc.hash;};   // preserva ?sala=..&rede=.. e #hash
  if(typeof window==='undefined'||typeof document==='undefined'){if(typeof module!=='undefined')module.exports={RE,novaUrl};return;}
  const h=location.hostname;if(location.protocol==='file:'||h==='localhost'||h==='127.0.0.1'||h==='[::1]'||!window.fetch)return;
  const mm=document.querySelector('meta[name=versao-site]'),MINHA=mm&&mm.content;if(!MINHA)return;   // versão desta página = a do próprio <meta>
  let busy=false;
  const livre=()=>{try{return typeof UI==='undefined'||(UI.estado==='menu'&&!(typeof Online!=='undefined'&&Online.ativo));}catch(e){return false;}};   // nunca recarrega em partida/sala
  function checar(){if(busy)return;busy=true;
    fetch(location.pathname+'?nc='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{busy=false;const m=RE.exec(t||'');if(!m||m[1]===MINHA||!livre())return;
      try{if(sessionStorage.getItem('tt-recarregou')===m[1])return;sessionStorage.setItem('tt-recarregou',m[1]);}catch(e){return;}
      location.replace(novaUrl(location,m[1]));}).catch(()=>{busy=false;});}
  checar();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&typeof UI!=='undefined'&&livre())checar();});
})();
</script>
<title>Tibia Tactics</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=MedievalSharp&display=swap" rel="stylesheet">
<style>
:root{--ouro:#d9b45a;--ouro2:#8a6f2e;--ouro3:#3a321c;--bg:#07080c;--pn1:#191c29;--pn2:#0f111a;--txt:#cfc9b4;--mut:#8f8a78;--verde:#6fe27f;--verm:#e0574a;--azul:#5aa9ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#141824 0%,#07080c 70%);color:var(--txt);font:11px Verdana,Geneva,sans-serif;user-select:none;-webkit-user-select:none}
img,canvas{image-rendering:pixelated}
button{font-family:inherit}
#app{display:grid;grid-template-columns:250px minmax(0,1fr) 236px;--hh:60px;--bh:176px;grid-template-rows:var(--hh) minmax(0,1fr) var(--bh);gap:6px;padding:6px;height:100vh}
.painel{background:linear-gradient(180deg,var(--pn1),var(--pn2));border:1px solid #6b5a2e;box-shadow:inset 0 0 0 1px #05060a,inset 0 0 0 2px #2b2616,0 2px 10px #000a;border-radius:3px;padding:8px;position:relative;min-height:0}
.painel h2,.painel h3{font:700 12px Cinzel,'Palatino Linotype',serif;color:var(--ouro);letter-spacing:.1em;text-transform:uppercase;margin:0 0 7px;padding-bottom:5px;border-bottom:1px solid var(--ouro3)}
.painel h3{font-size:11px;margin-bottom:5px}
/* ---------- topo ---------- */
#topo{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:4px 12px}
#logo{font:400 25px MedievalSharp,Cinzel,serif;color:var(--ouro);text-shadow:0 0 12px #d9b45a55,0 2px 0 #000;letter-spacing:.03em;white-space:nowrap;cursor:pointer}
#logo small{display:block;font:400 9px Verdana;color:var(--mut);letter-spacing:.2em;text-transform:uppercase;margin-top:-3px;text-shadow:none}
#estagio{text-align:center;min-width:92px}
#estagio b{font:700 25px Cinzel,serif;color:#f1e3b0;text-shadow:0 0 10px #d9b45a44,0 2px 0 #000;line-height:1}
#estagio span{display:block;font-size:10px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
#trilha{display:flex;gap:4px;align-items:center}
.rd{width:30px;height:30px;border:1px solid #3a321c;background:#0b0d14;border-radius:3px;display:flex;align-items:center;justify-content:center;opacity:.55;position:relative}
.rd img{width:24px;height:24px}
.rd.atual{opacity:1;border-color:var(--ouro);box-shadow:0 0 8px #d9b45a66,inset 0 0 6px #d9b45a33;background:#161209}
.rd.feito{opacity:.28}
#tempo{flex:1;min-width:120px;max-width:340px}
#tempo .txt{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em}
#tempo .txt b{font:700 15px Cinzel,serif;color:#f1e3b0;letter-spacing:0}
.barra{height:8px;background:#05060a;border:1px solid #3a321c;border-radius:2px;overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(#e7c866,#a77f26);transition:width .25s linear}
#cabdir{margin-left:auto;display:flex;align-items:center;gap:14px}
.stat{display:flex;align-items:center;gap:6px}
.stat img{width:26px;height:26px}
.stat b{font:700 17px Cinzel,serif;color:#f3e6b4}
.stat small{display:block;color:var(--mut);font-size:9px;text-transform:uppercase;letter-spacing:.08em}
#nivelbox{min-width:118px}
#nivelbox .nv{font:700 13px Cinzel,serif;color:#f3e6b4;display:flex;justify-content:space-between}
#nivelbox .nv span{font:10px Verdana;color:var(--mut)}
#nivelbox .barra i{background:linear-gradient(#6aa8ff,#2c5fb0)}
.bt{background:linear-gradient(#3b3421,#1f1b10);border:1px solid var(--ouro2);color:var(--ouro);font:700 12px Cinzel,serif;letter-spacing:.06em;padding:6px 10px;border-radius:3px;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff14,0 1px 3px #000a;text-transform:uppercase;transition:filter .12s}
.bt:hover:not(:disabled){filter:brightness(1.35);color:#f4dc92}
.bt:active:not(:disabled){transform:translateY(1px)}
.bt:disabled{opacity:.4;cursor:default}
.bt.peq{padding:4px 8px;font-size:10px}
.bt.primario{background:linear-gradient(#6b5420,#3a2c0e);border-color:#d9b45a;color:#fff1c4}
/* ---------- laterais ---------- */
#esq,#dir{overflow:auto;overflow-x:hidden}
#esq::-webkit-scrollbar,#dir::-webkit-scrollbar{width:6px}
#esq::-webkit-scrollbar-thumb,#dir::-webkit-scrollbar-thumb{background:#3a321c;border-radius:3px}
/* ícone de traço: item real do Tibia (32x32 desenhado a 1x, nunca em escala fracionária) dentro de um brasão; origem = hexágono, classe = escudo; o aro mostra o nível */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.ti{display:inline-block;flex:none;position:relative;line-height:0;vertical-align:middle}
.tb{--s:44px;--aro:linear-gradient(160deg,#4d4a40,#2b2a24 60%,#44413a);--fundo:radial-gradient(circle at 50% 35%,#1c1e28,#08090d 85%);position:relative;display:inline-block;flex:none;width:var(--s);cursor:help}
.tb.hx{height:calc(var(--s)*1.1547)}
.tb.sh{height:calc(var(--s)*1.1)}
.tb .ar{position:absolute;inset:0;background:var(--aro)}
.tb.hx .ar{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.tb.sh .ar{clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}
.tb .ar i{position:absolute;inset:3px;clip-path:inherit;background:var(--fundo)}
.tb.sh .ar i{inset:3px 3px 4px}
.tb img{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;image-rendering:pixelated;filter:drop-shadow(0 1px 0 #000b);pointer-events:none}
.tb.sh img{top:46%}
.tb.n-1 img{filter:grayscale(1) brightness(.55);opacity:.8}
.tb.n0{--aro:linear-gradient(160deg,#f6bd86,#8a4a22 52%,#d79356);--fundo:radial-gradient(circle at 50% 35%,#523018,#150c06 85%)}
.tb.n1{--aro:linear-gradient(160deg,#fff,#8d97a8 52%,#e4e9f2);--fundo:radial-gradient(circle at 50% 35%,#3c4558,#0d1017 85%)}
.tb.n2{--aro:linear-gradient(160deg,#fff4a8,#b98312 52%,#f6d355);--fundo:radial-gradient(circle at 50% 35%,#5d4510,#1a1304 85%)}
.tb.n3{--aro:conic-gradient(from var(--ang),#ff86dc,#78f2ff,#fff58a,#aa8cff,#7bffb4,#ff86dc);--fundo:radial-gradient(circle at 50% 35%,#3a2a58,#0f0b1a 85%);animation:prisma 7s linear infinite;filter:drop-shadow(0 0 4px #b992ff99)}
@keyframes prisma{to{--ang:360deg}}
.ti[data-tr]:hover .tb{filter:brightness(1.22)}
.ti.acende .tb{filter:drop-shadow(0 0 4px #ffd95a)}
.ti.acende::after{content:'+';position:absolute;right:-3px;top:-4px;z-index:2;font:700 11px Cinzel,serif;line-height:12px;color:#1b1400;background:#ffd95a;border-radius:50%;width:12px;text-align:center;box-shadow:0 0 4px #ffd95a99}
/* painel de sinergias: ícone no brasão, nome sempre escrito, contador grande e os degraus (o atingido aceso, com a cor do nível) */
.sin{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:9px;align-items:center;padding:5px 8px 5px 6px;border:1px solid #1d1b14;border-left:3px solid #2b2a24;border-radius:3px;margin-bottom:4px;background:#0b0d14;position:relative;cursor:help;transition:background .15s,border-color .15s}
.sin:hover{background:#141725;border-color:#4a4228}
.sin .ti{grid-row:1/3;grid-column:1;--s:44px}
.sin .nm{grid-column:2;grid-row:1;align-self:end;font:700 13px/1.1 Cinzel,serif;color:#f0e8cc;letter-spacing:.02em;text-shadow:0 1px 0 #000}
.sin.ativa .nm{color:#ffe9a0}
.sin .ct{grid-column:3;grid-row:1/3;text-align:right;white-space:nowrap;line-height:1}
.sin .ct b{font:700 23px Cinzel,serif;color:#fff1c4;text-shadow:0 1px 0 #000}
.sin:not(.ativa) .ct b{color:#aaa58f}
.sin .ct em{font:700 12px Cinzel,serif;font-style:normal;color:#a39e88;margin-left:2px}
.sin .ct em.max{color:#ffe27a;margin-left:4px}
.sin .pips{grid-column:2;grid-row:2;align-self:start;display:flex;align-items:center;gap:3px;margin-top:4px}
.sin .pips .tp{font:9px Verdana;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.pp{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:16px;padding:0 3px;border:1px solid #3a382e;border-radius:3px;background:#0a0b10;color:#8a8672;font:700 10px Cinzel,serif}
.pp.at{color:#1a1204;border-color:#0008;text-shadow:0 1px 0 #fff6}
.pp.c0{background:linear-gradient(#f6bd86,#a5612c)}.pp.c1{background:linear-gradient(#fff,#a9b2c2)}.pp.c2{background:linear-gradient(#fff4a8,#d9a21c)}.pp.c3{background:linear-gradient(120deg,#ff9be4,#8ff4ff,#fff58a,#b79cff)}
.pp.cur{outline:1px solid #fff;outline-offset:1px}
.sin.ativa{background:linear-gradient(90deg,#2a210d,#12141d 78%);border-color:#4a3f1f}
.sin.ativa.n0{border-left-color:#d08a4e}.sin.ativa.n1{border-left-color:#dfe5f0}.sin.ativa.n2{border-left-color:#f3cf4f}.sin.ativa.n3{border-left-color:#c9a6ff}

.vazio{color:var(--mut);font-size:10.5px;line-height:1.5;padding:4px}
/* lista de jogadores */
#jogadores{display:flex;flex-direction:column}
.jg{display:grid;grid-template-columns:40px minmax(0,1fr);gap:7px;align-items:center;padding:4px 5px;border:1px solid #1d1b14;border-radius:3px;margin-bottom:3px;background:#0b0d14;position:relative;cursor:pointer;transition:background .15s,border-color .15s}
.jg:hover{border-color:#4a4228;background:#12141d}
.jg.opo{border-color:var(--ouro);background:linear-gradient(90deg,#2d2310,#10121a);box-shadow:0 0 8px #d9b45a33}
.jg.eu{border-color:#3e6aa8}
.jg.espiando{border-color:#79b8ff;box-shadow:0 0 0 1px #79b8ff55,inset 0 0 10px #79b8ff22}
.jg.morto{opacity:.4;filter:grayscale(1)}
.av{width:40px;height:40px;flex:none;background:radial-gradient(circle at 50% 35%,#1e2232,#06070b);border:1px solid #3a321c;border-radius:2px;position:relative;overflow:hidden}
.av canvas{width:100%;height:100%;display:block}
.av .lv{position:absolute;right:0;bottom:0;background:#000c;color:#f3e6b4;font:700 9px Cinzel,serif;padding:0 3px;border-top-left-radius:3px}
.jg .nm{font:700 11px Cinzel,serif;color:#e8dfc2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.jg.eu .nm{color:#9fc4ff}.jg.hum .nm{color:#9fe8b0}
.jg .nm img{width:12px;height:12px;flex:none}
.jg .hpb{height:9px;background:#05060a;border:1px solid #3a321c;margin-top:3px;position:relative;overflow:hidden}
.jg .hpb i{position:absolute;left:0;top:0;bottom:0;transition:width .8s ease-out,background-color .5s}
.jg .hpb i.ch{background:#f4f0e0;transition:width .9s ease-in .45s}
.jg .hpn{position:absolute;right:3px;top:-1px;font:700 8px/10px Verdana;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 0 #000}
.jg .rod{display:flex;align-items:center;gap:3px;margin-top:3px;height:12px}
.jg .rod b{width:9px;height:9px;border-radius:1px;background:#1a1b22;border:1px solid #2b2a24;flex:none}
.jg .rod b.v{background:#3fae52;border-color:#74e08a}.jg .rod b.d{background:#b8433a;border-color:#f08a7c}.jg .rod b.e{background:#8a8575;border-color:#c9c4ae}
.jg .seq{margin-left:auto;display:flex;align-items:center;gap:1px;font:700 10px Cinzel,serif}
.jg .seq svg{width:11px;height:13px}
.jg .seq.w{color:#ffb24a}.jg .seq.l{color:#7fa8e0}
.jg .pos{position:absolute;left:-1px;top:-1px;background:#000d;color:var(--ouro);font:700 9px Cinzel,serif;padding:0 3px;border-bottom-right-radius:3px;z-index:2}
.jg .fala{position:absolute;right:4px;top:-9px;z-index:3;background:#000d;border:1px solid #6b5a2e;border-radius:8px;padding:1px 8px;font:700 11px Verdana;color:#ffe14a;text-shadow:0 1px 0 #000;animation:fala 3s forwards;pointer-events:none}
@keyframes fala{0%{opacity:0;transform:translateY(5px)}8%,80%{opacity:1;transform:none}100%{opacity:0}}
.jg .olho{position:absolute;right:4px;bottom:3px;width:14px;height:10px;opacity:0}
.jg.espiando .olho{opacity:1}
/* ---------- centro ---------- */
#centro{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;gap:6px}
#faixa-rodada{flex:none;height:46px;display:flex;align-items:center;gap:10px;padding:4px 12px;min-width:0;overflow:hidden;white-space:nowrap}
#faixa-rodada .rt{font:700 10px Cinzel,serif;color:var(--ouro);letter-spacing:.14em;text-transform:uppercase;flex:none}
#faixa-rodada .sep{width:1px;align-self:stretch;margin:2px 0;background:linear-gradient(transparent,#6b5a2e,transparent);flex:none}
#faixa-rodada .mons{display:flex;gap:5px;align-items:center}
#faixa-rodada .mon{position:relative;width:32px;height:32px;background:radial-gradient(circle at 50% 40%,#2b1d1d,#0a0809);border:1px solid #6e3a33;border-radius:3px;flex:none}
#faixa-rodada .mon canvas{width:100%;height:100%;display:block}
#faixa-rodada .mon b{position:absolute;right:1px;bottom:0;font:700 10px Cinzel,serif;color:#ffe9a0;text-shadow:0 1px 0 #000,0 0 3px #000}
#faixa-rodada .drops{display:flex;align-items:center;gap:3px}
#faixa-rodada .drops img{width:32px;height:32px;background:#07080d;border:1px solid #3a321c;border-radius:2px}
#faixa-rodada .drops .ic{margin-left:3px}
#faixa-rodada .drops .ic img{border:0;background:none}
#faixa-rodada .bau{width:30px;height:30px;flex:none;filter:drop-shadow(0 1px 2px #000)}
#faixa-rodada .info{font-size:10.5px;color:#d4cdb4;overflow:hidden;text-overflow:ellipsis}
#faixa-rodada .info b{font:700 12px Cinzel,serif;color:#f3e6b4}
#faixa-rodada .av{width:32px;height:32px}
#faixa-rodada .ti{--s:32px}
#faixa-rodada .trs{display:flex;gap:4px;align-items:center}
#cvbox{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
#cvw{position:relative;line-height:0}
#cv{display:block;border:1px solid #6b5a2e;box-shadow:0 0 0 1px #05060a,0 0 0 3px #2b2616,0 6px 24px #000c;border-radius:2px;touch-action:none;cursor:default;background:#0a0b10}
#faixa{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;line-height:normal;white-space:nowrap;z-index:6}
#faixa.on{opacity:1}
#faixa b{display:block;font:400 54px MedievalSharp,Cinzel,serif;letter-spacing:.06em;text-shadow:0 3px 0 #000,0 0 22px currentColor}
#faixa span{display:block;margin-top:4px;font:700 15px Cinzel,serif;color:#f3e6b4;text-shadow:0 2px 0 #000,0 0 6px #000}
#faixa small{display:block;margin-top:6px;font:12px Verdana;color:#cfc9b4;text-shadow:0 1px 0 #000,0 0 4px #000}
#faixa.res{top:46%}
#faixa.res b{font-size:64px;text-shadow:none;animation:resTit .7s cubic-bezier(.2,1.4,.4,1) both}
#faixa.res.vit b{background:linear-gradient(180deg,#fff7c9,#f0c744 55%,#a8730f);-webkit-background-clip:text;background-clip:text;color:transparent!important;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 16px #e6c25acc)}
#faixa.res.der b{background:linear-gradient(180deg,#ffd0c8,#e0473c 55%,#6d1410);-webkit-background-clip:text;background-clip:text;color:transparent!important;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 16px #e0473caa)}
#faixa .dano{display:block;margin-top:2px;font:700 46px Cinzel,serif;color:#ff6a5a;text-shadow:0 3px 0 #000,0 0 18px #e0473c;animation:danoNum .9s .35s cubic-bezier(.2,1.6,.4,1) both}
#faixa .dano i{font:700 14px Cinzel,serif;font-style:normal;color:#ffd6cf;letter-spacing:.2em;margin-left:8px;text-transform:uppercase}

/* ---------- resultado da rodada: banner ornamentado, fagulhas, vinheta e rachaduras ---------- */
#faixa.res::before{content:'';position:absolute;inset:-34px -70px;background:radial-gradient(ellipse,#000b 0%,#0006 45%,transparent 72%);z-index:-1}
#faixa .orn{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.6vw,16px)}
#faixa .orn i{flex:none;position:relative;width:clamp(22px,8vw,120px);height:3px;background:linear-gradient(90deg,transparent,var(--oc,#e6c25a));animation:ornAbre .8s .15s both}
#faixa .orn i:last-child{background:linear-gradient(270deg,transparent,var(--oc,#e6c25a))}
#faixa .orn i::after{content:'';position:absolute;top:-3px;width:8px;height:8px;background:var(--oc,#e6c25a);transform:rotate(45deg);box-shadow:0 0 8px var(--oc,#e6c25a)}
#faixa .orn i:first-child::after{right:-2px}#faixa .orn i:last-child::after{left:-2px}
#faixa.res.vit{--oc:#f0c744}#faixa.res.der{--oc:#e0473c}#faixa.res.emp{--oc:#bfc6d4}
@keyframes ornAbre{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
#faixa.res.emp b{background:linear-gradient(180deg,#fff,#c3c9d6 55%,#6b7384);-webkit-background-clip:text;background-clip:text;color:transparent!important;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 12px #bfc6d488)}
#faixa .chip-seq{display:inline-flex;align-items:center;gap:6px;width:max-content;max-width:86vw;margin-top:8px;padding:4px 12px;border-radius:14px;font:700 12px Cinzel,serif;letter-spacing:.04em;white-space:normal;text-shadow:0 1px 0 #000;animation:chipEntra .5s .9s cubic-bezier(.2,1.5,.4,1) both}
#faixa .chip-seq svg{width:11px;height:14px;flex:none}
#faixa .chip-seq.w{color:#ffe9a0;background:linear-gradient(#5a4310,#2d230c);border:1px solid #e6c25a;box-shadow:0 0 12px #e6c25a66}
#faixa .chip-seq.l{color:#cfe0ff;background:linear-gradient(#27375c,#141b2e);border:1px solid #7fa8e0;box-shadow:0 0 12px #5a86d066}
@keyframes chipEntra{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
#faixa .fg-box{position:absolute;left:50%;top:34%;width:0;height:0;pointer-events:none}
#faixa .fg-box i{position:absolute;left:-7px;top:-7px;width:15px;height:15px;background:#fff3b0;filter:drop-shadow(0 0 4px #f0c744);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:fagulha var(--d) var(--a) ease-out infinite}
@keyframes fagulha{0%{transform:translate(0,0) scale(.2) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(160deg);opacity:0}}
html.reduz #faixa .fg-box{display:none}
#vinheta{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .45s;z-index:5}
#vinheta.on{opacity:1}
#vinheta.vit{background:radial-gradient(ellipse at center,transparent 50%,#e6c25a38 82%,#e6c25a66 100%)}
#vinheta.der{background:radial-gradient(ellipse at center,#14000022 25%,#7a0a0a66 70%,#3a0000cc 100%)}
#vinheta.der::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='xMidYMid slice' fill='none' stroke-linejoin='bevel' stroke-linecap='round'><g id='c'><path d='M50 46L44 38L46 30L40 22L41 12L37 0M46 30L52 24L51 16M40 22L33 20L28 12M50 46L58 40L57 31L65 25L63 14L70 0M57 31L64 34L70 31M50 46L40 50L33 48L24 56L14 54L0 60M33 48L30 40L22 38M24 56L22 66M50 46L60 52L66 50L75 60L88 58L100 64M66 50L69 42L78 40M75 60L72 70M50 46L47 56L52 66L46 78L50 90L47 100M52 66L60 72L58 82'/></g><use href='%23c' stroke='%23000' stroke-opacity='.7' stroke-width='.9'/><use href='%23c' stroke='%23ffe0da' stroke-opacity='.75' stroke-width='.32'/></svg>") center/cover no-repeat;animation:rachaduras .28s cubic-bezier(.1,1.4,.4,1) both}
@keyframes rachaduras{from{transform:scale(1.25);opacity:0}to{transform:none;opacity:1}}
html.reduz #vinheta.der::after{animation:none}
@keyframes resTit{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes danoNum{0%{transform:scale(2.6) translateY(-14px);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
#aviso{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#000b;border:1px solid var(--ouro2);color:#f3e6b4;padding:5px 14px;border-radius:3px;font:700 12px Cinzel,serif;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;line-height:normal;z-index:7}
#aviso.on{opacity:1}
#bt-meter{position:absolute;right:6px;top:6px;z-index:8;line-height:normal;display:flex;align-items:center;gap:5px}
#bt-meter svg{width:13px;height:13px}
#bt-meter.on{border-color:#e6d27a;color:#fff1c4;background:linear-gradient(#5a4a1c,#2d230c)}
#espia{position:absolute;left:6px;top:6px;z-index:8;display:none;align-items:center;gap:10px;padding:5px 8px 5px 12px;line-height:normal;border-color:#79b8ff;white-space:nowrap}
#espia.on{display:flex}
#espia span{font:700 12px Cinzel,serif;color:#cfe4ff;letter-spacing:.06em}
#espia span b{color:#fff}
/* placar da luta (damage meter) */
#meter{position:absolute;right:6px;top:34px;width:min(290px,70%);max-height:calc(100% - 44px);overflow:auto;z-index:8;display:none;padding:6px 8px 8px;line-height:normal;background:linear-gradient(180deg,#191c29f2,#0f111af2)}
#meter.on{display:block}
#meter.fora{left:calc(100% + 10px);right:auto;top:0;width:222px;max-height:100%}
#meter::-webkit-scrollbar{width:5px}#meter::-webkit-scrollbar-thumb{background:#3a321c}
#meter .abas{display:flex;gap:3px;margin-bottom:5px}
#meter .abas button{flex:1;font:700 9.5px Cinzel,serif;letter-spacing:.04em;padding:3px 2px;background:#0b0d14;border:1px solid #3a321c;color:var(--mut);cursor:pointer;border-radius:2px;text-transform:uppercase}
#meter .abas button.on{border-color:var(--ouro);color:#fff1c4;background:linear-gradient(#3b3016,#1b1608)}
#meter .tt{font:10px Verdana;color:var(--mut);margin-bottom:4px;display:flex;justify-content:space-between}
.mt{display:grid;grid-template-columns:26px minmax(0,1fr);gap:5px;align-items:center;margin-bottom:3px}
.mt canvas{width:26px;height:26px;background:#07080d;border:1px solid #2b2616;border-radius:2px}
.mt .bar{position:relative;height:20px;background:#07080d;border:1px solid #2b2616;border-radius:2px;overflow:hidden}
.mt .bar i{position:absolute;left:0;top:0;bottom:0;transition:width .25s linear}
.mt.a .bar i{background:linear-gradient(90deg,#1c4a8f,#4a8fe8)}.mt.b .bar i{background:linear-gradient(90deg,#8f241c,#e8584a)}
.mt .bar span{position:absolute;left:5px;right:5px;top:0;line-height:18px;font:700 10px Verdana;color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000;display:flex;justify-content:space-between;white-space:nowrap}
.mt.mor{opacity:.55}
#meter .tot{display:flex;gap:6px;margin:0 0 6px}
#meter .tot div{flex:1;text-align:center;padding:3px;border:1px solid #2b2616;background:#0b0d14;font:700 12px Cinzel,serif;color:#fff1c4;border-radius:2px}
#meter .tot div.a{border-color:#2b5a9f}#meter .tot div.b{border-color:#9f3a31}
#meter .tot small{display:block;font:8.5px Verdana;color:var(--mut);text-transform:uppercase}
/* ---------- base: itens, loja, botões ---------- */
#base{grid-column:1/4;display:grid;grid-template-columns:204px minmax(0,1fr) 196px;gap:6px}
#grade-itens{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.slot{width:100%;aspect-ratio:1;max-width:35px;background:#07080d;border:1px solid #2f2a18;border-radius:2px;display:flex;align-items:center;justify-content:center;position:relative}
.slot.cheio{border-color:#6b5a2e;background:linear-gradient(#171307,#0b0a05)}
.slot.alvo{border-color:#6fe27f;box-shadow:0 0 7px #6fe27faa}.slot.alvo.ruim{border-color:#e0574a;box-shadow:0 0 7px #e0574aaa}
.slot .ic{cursor:grab}
#itens h3{display:flex;align-items:center;justify-content:space-between;gap:4px}
#itens h3 .bts{display:flex;gap:3px}#itens h3 .bt{padding:2px 6px;font-size:9px;letter-spacing:.04em}
#bt-forjar{border-color:#ffd24a;color:#fff1c4;background:linear-gradient(#6b5420,#3a2c0e);animation:respira2 1.4s ease-in-out infinite alternate}
@keyframes respira2{from{box-shadow:0 0 0 #ffd24a00}to{box-shadow:0 0 9px #ffd24acc}}
/* ---------- itens: ícone real (32x32, sempre a 1x/2x) com contorno da forja (+1 prata, +2 ouro, +3 prismático) e gema do encantamento ---------- */
.ic{position:relative;display:inline-block;width:32px;height:32px;flex:none;vertical-align:top}
.ic img{display:block;width:32px;height:32px;position:relative;z-index:1;image-rendering:pixelated}
.ic.mini,.ic.mini img{width:16px;height:16px}
.ic.x2,.ic.x2 img{width:64px;height:64px}
.ic .gm{position:absolute;z-index:2;right:1px;bottom:1px;width:8px;height:8px;background:var(--g);border:1px solid #000;transform:rotate(45deg);box-shadow:inset 1px 1px 0 #ffffffaa}
.ic.mini .gm{width:5px;height:5px;right:0;bottom:0}.ic.x2 .gm{width:14px;height:14px;right:3px;bottom:3px}
.ic .fl{position:absolute;z-index:3;left:-1px;top:-4px;font:700 9px Verdana;color:#fff;text-shadow:0 0 2px #000,0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000}
.ic.mini .fl{display:none}.ic.x2 .fl{font-size:13px;top:-6px}
.ic.f1 img{filter:drop-shadow(1px 0 0 #dfe6f5) drop-shadow(-1px 0 0 #dfe6f5) drop-shadow(0 1px 0 #dfe6f5) drop-shadow(0 -1px 0 #dfe6f5) drop-shadow(0 0 3px #9fb8e8cc)}
.ic.f2 img{filter:drop-shadow(1px 0 0 #ffd24a) drop-shadow(-1px 0 0 #ffd24a) drop-shadow(0 1px 0 #ffd24a) drop-shadow(0 -1px 0 #ffd24a) drop-shadow(0 0 4px #ffb42acc)}
.ic.f3 img{filter:drop-shadow(1px 0 0 #ff6ad8) drop-shadow(-1px 0 0 #5ff0ff) drop-shadow(0 1px 0 #fff36a) drop-shadow(0 -1px 0 #7dff7a) drop-shadow(0 0 4px #c9a0ffcc)}
.ic.f3::after{content:'';position:absolute;inset:-3px;z-index:0;border-radius:50%;background:radial-gradient(circle,#ffffff55,#c9a0ff00 70%);animation:prisma 1.8s ease-in-out infinite alternate;pointer-events:none}
@keyframes prisma{from{opacity:.2}to{opacity:.95}}
.ic.perg::before{content:'';position:absolute;inset:0;z-index:0;border-radius:3px;background:radial-gradient(circle at 30% 25%,#ecdcaa,#bf9f58 62%,#7d6030);border:1px solid #3d2c0c;box-shadow:inset 0 0 0 1px #ffffff33}
/* prévia ao arrastar um item ("Sword + Bow -> Arbalest") */
#previa{position:fixed;z-index:75;display:none;pointer-events:none;padding:6px 10px 7px;background:linear-gradient(180deg,#1f2333,#0d0f17);border:1px solid var(--ouro2);border-radius:4px;box-shadow:0 6px 20px #000d;text-align:center;white-space:nowrap}
#previa .ln{display:flex;align-items:center;justify-content:center;gap:8px}
#previa .ln i{font:700 18px Cinzel,serif;font-style:normal;color:var(--ouro)}
#previa .tx{margin-top:4px;font:700 11px Cinzel,serif;color:#e6d9ab}#previa .tx b{color:#ffe9a0}#previa .tx small{display:block;font:10px Verdana;color:#8fe6a0}
#previa.ruim{border-color:#e0574a}#previa .ruim{font:700 11px Cinzel,serif;color:#ffb0a0}
#ghost{position:fixed;z-index:80;pointer-events:none;display:none;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 4px #000a)}
#loja{display:flex;flex-direction:column;padding:6px}
#cartas{display:flex;gap:6px;flex:1;min-height:0;padding:0 8px}
/* cada carta fica num encaixe fixo: o mouse "pertence" ao encaixe, então a carta pode subir sem tremer */
.cslot{flex:1;min-width:0;position:relative;display:flex;cursor:pointer}
.cslot:hover{z-index:30}
/* carta: moldura de pedra e metal por custo, rebites nos cantos */
.carta{--tc:#9aa1ae;--tx:#fff;flex:1;min-width:0;position:relative;display:flex;flex-direction:column;padding:6px;cursor:pointer;border-radius:6px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--tc) 55%,#fff) 0%,var(--tc) 20%,color-mix(in srgb,var(--tc) 62%,#000) 50%,color-mix(in srgb,var(--tc) 85%,#fff) 76%,color-mix(in srgb,var(--tc) 55%,#000) 100%);
  box-shadow:0 0 0 1px #000,0 3px 8px #000b,inset 0 1px 0 #fff7,inset 0 -2px 0 #0008;transform-origin:50% 100%;transform:translateY(var(--dy,0px)) rotate(var(--r,0deg));transition:transform .12s ease-out,filter .12s}
.carta::before{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:5px;
  background:radial-gradient(circle at 5px 5px,#fff 0 .7px,#cfc8b0 1.1px,#3d392c 2.3px,transparent 2.9px) no-repeat,
  radial-gradient(circle at calc(100% - 5px) 5px,#fff 0 .7px,#cfc8b0 1.1px,#3d392c 2.3px,transparent 2.9px) no-repeat,
  radial-gradient(circle at 5px calc(100% - 5px),#fff 0 .7px,#cfc8b0 1.1px,#3d392c 2.3px,transparent 2.9px) no-repeat,
  radial-gradient(circle at calc(100% - 5px) calc(100% - 5px),#fff 0 .7px,#cfc8b0 1.1px,#3d392c 2.3px,transparent 2.9px) no-repeat}
.carta.c1{--tc:#a9afbb;--tx:#12141b}.carta.c2{--tc:#3fc260}.carta.c3{--tc:#3d8bff}.carta.c4{--tc:#b45cff}.carta.c5{--tc:#f4c430;--tx:#2a1c00}
/* moldura por custo (estilo TFT): anel interno na cor, placa do nome e selo de custo coloridos */
.carta:not(.runa) .cin{box-shadow:inset 0 0 0 1px #000,0 0 0 1px #000,0 0 0 3px var(--tc),0 0 0 4px #000a}
.carta:not(.runa) .cn{background:linear-gradient(color-mix(in srgb,var(--tc) 62%,#15141d),color-mix(in srgb,var(--tc) 30%,#0b0b12));color:#fff;box-shadow:inset 0 1px 0 #fff4,inset 0 -1px 0 color-mix(in srgb,var(--tc) 70%,transparent)}
.carta:not(.runa) .cu{background:linear-gradient(color-mix(in srgb,var(--tc) 80%,#fff),color-mix(in srgb,var(--tc) 75%,#000));color:var(--tx);border-color:#000;box-shadow:0 0 0 1px var(--tc),0 1px 3px #000a;text-shadow:none}
/* leque (−4° a +4°, em arco); com o mouse em cima a carta sobe ~24 px, endireita, cresce ~1,12x e fica na frente */
.cslot:hover .carta:not(.vend){transform:translateY(-24px) rotate(0deg) scale(1.12);filter:brightness(1.12);box-shadow:0 0 0 1px #000,0 10px 22px #000d,inset 0 1px 0 #fff7,inset 0 -2px 0 #0008}
body.arrastando .cslot:hover .carta:not(.vend){transform:translateY(var(--dy,0px)) rotate(var(--r,0deg));filter:none}
html.reduz .cslot:hover .carta:not(.vend){transform:translateY(var(--dy,0px)) rotate(var(--r,0deg));filter:brightness(1.12)}
.carta.vend{opacity:.16;cursor:default;filter:grayscale(1)}
.carta.vend::before{display:none}
.carta .cin{flex:1;min-height:0;display:flex;flex-direction:column;background:#0a0b11;border-radius:3px;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px #000,0 0 0 1px #0006}
.carta .cn{flex:none;height:19px;display:flex;align-items:center;justify-content:center;padding:0 22px;background:linear-gradient(#2b2938,#16151f);border-bottom:1px solid #000;box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--tc) 55%,transparent);
  font:700 11px Cinzel,'Palatino Linotype',serif;color:#f4ead0;text-shadow:0 1px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.carta .art{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:#101018}
.carta .art::before{content:'';position:absolute;inset:0;background:var(--chao) 0 0/256px 51px repeat;image-rendering:pixelated;opacity:.95;filter:brightness(.8) saturate(1.1)}
.carta .art::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,transparent 35%,#000b 100%),linear-gradient(#0008,transparent 40%,#0006);pointer-events:none}
.carta .art canvas{position:relative;z-index:1;width:128px;height:92px;filter:drop-shadow(0 3px 2px #000a);flex:none}
.carta .cu{position:absolute;right:3px;top:3px;z-index:2;display:flex;align-items:center;gap:3px;padding:1px 6px 1px 4px;border-radius:10px;background:#000c;border:1px solid var(--tc);font:700 12px Cinzel,serif;color:#fff1c4;text-shadow:0 1px 0 #000}
.carta .cu img{width:15px;height:15px}
.carta.pobre .cu{color:#ff8a7a}.carta.pobre .art canvas{filter:drop-shadow(0 3px 2px #000a) grayscale(.55) brightness(.8)}
.carta .tecla{position:absolute;left:3px;top:3px;z-index:2;width:15px;height:15px;line-height:14px;text-align:center;border-radius:3px;background:#000b;border:1px solid #4a4638;font:700 9px Verdana;color:#b3ab90}
.carta .pie{flex:none;height:42px;display:flex;align-items:center;gap:5px;padding:0 6px;background:linear-gradient(#14131b,#0c0c12);border-top:1px solid #000}
.carta .pie .ti{--s:34px}
.carta .copias{margin-left:auto;font:700 9.5px Verdana;color:#8bc7ff;text-shadow:0 1px 0 #000}
/* destaque suave: já tenho a unidade = carta um pouco mais clara com borda dourada fina (sem animação); perto de promover = brilho que "respira" devagar e selo discreto */
.carta .selo{position:absolute;left:9px;bottom:48px;z-index:5;padding:0 6px;height:15px;line-height:14px;border-radius:8px;background:rgba(20,15,4,.8);border:1px solid rgba(240,204,100,.85);color:#ffe27a;font:700 10px Verdana;letter-spacing:1px;text-shadow:0 1px 0 #000;white-space:nowrap}
.carta.tem{filter:brightness(1.08)}
.carta.tem::after,.carta.pert::after{content:'';position:absolute;inset:0;border-radius:5px;border:1px solid rgba(236,200,96,.9);box-shadow:0 0 6px rgba(255,214,90,.3);pointer-events:none;z-index:6}
.carta.pert .cin::before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 16px 3px rgba(255,214,90,.95);animation:respira 2s ease-in-out infinite alternate}
.carta.pert3 .cin::before{box-shadow:inset 0 0 18px 4px rgba(255,244,190,.98)}
.carta.pert3::after{border-color:rgba(255,246,190,.95)}
@keyframes respira{from{opacity:.25}to{opacity:.5}}
.carta.c4 .cin::after,.carta.c5 .cin::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(112deg,transparent 42%,#ffffff30 50%,transparent 58%) 0 0/260% 100% no-repeat;animation:brilho 3.4s linear infinite}
.carta.c5 .cin::after{background-image:linear-gradient(112deg,transparent 40%,#fff1a855 50%,transparent 60%);animation-duration:2.6s}
.carta.c5:not(.pert):not(.vend){animation:brilho5 2.8s ease-in-out infinite}
@keyframes brilho{from{background-position:140% 0}to{background-position:-60% 0}}
@keyframes brilho5{0%,100%{box-shadow:0 0 0 1px #000,0 3px 8px #000b,inset 0 1px 0 #fff7,inset 0 -2px 0 #0008}50%{box-shadow:0 0 0 1px #000,0 0 14px 1px #e0b03099,inset 0 1px 0 #fff7,inset 0 -2px 0 #0008}}
.voo{position:fixed;z-index:45;pointer-events:none;transform-origin:0 0;will-change:transform}
.voo .carta{width:100%;height:100%;animation:none!important;transform:none!important;--r:0deg}
.voo .carta *,.voo .carta::before,.voo .carta::after{animation:none!important}
/* botões e chances da loja */
#botoes{display:flex;flex-direction:column;gap:4px;justify-content:center;padding:6px 8px}
#botoes .bt{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 9px}
#botoes .bt span{font:10px Verdana;color:#b2a26b;text-transform:none;letter-spacing:0;display:flex;align-items:center;gap:3px}
#botoes .bt span img{width:13px;height:13px}
#botoes .bt.on{border-color:#e6d27a;color:#fff1c4;background:linear-gradient(#5a4a1c,#2d230c)}
/* poder da vocação (Fase 5) */
#bt-poder{border-color:#6e5fa8}#bt-poder canvas{width:22px;height:22px;flex:none}#bt-poder .lb{flex:1;text-align:left;font-size:11px;line-height:1.1}#bt-poder .pn-c{display:none;font-style:normal}#bt-poder .pn-l{font-style:normal}
#bt-poder.on{border-color:#9fd8ff;background:linear-gradient(#27456a,#132338);box-shadow:0 0 8px #6fb8ff88}#bt-poder.usado{opacity:.5}
#dica-poder{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:#0a2236e8;border:1px solid #6fb8ff;color:#d8efff;padding:5px 14px;border-radius:3px;font:700 12px Cinzel,serif;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:7}
#dica-poder.on{opacity:1}
#cartas.alvo-poder .cslot .carta{outline:2px dashed #6fb8ff;outline-offset:-2px;cursor:crosshair}
.carta.c5.gelada{animation:none}.carta.gelada{box-shadow:0 0 0 2px #9fd8ff,0 0 14px #6fb8ffcc,inset 0 0 18px #bfe6ff66}.carta.gelada .art canvas{filter:drop-shadow(0 3px 2px #000a) hue-rotate(160deg) brightness(1.05)}
.carta .gelo-m{position:absolute;left:4px;top:26px;z-index:3;background:#0b3a5ae6;border:1px solid #9fd8ff;color:#d8f2ff;border-radius:9px;padding:0 6px;font:700 11px Verdana}
/* runas (Fase 5): carta de pedra na loja, mochila (3 vagas; as armadas brilham) e ícones armados no topo */
.carta.runa{--tc:#7b7b86;--rc:#b9b3c9;background:linear-gradient(145deg,#c4c4cf 0%,#8e8e9a 18%,#5a5a66 50%,#9494a0 76%,#44444d 100%)}
.carta.runa .cin{background:#15151c}
.carta.runa .cn{background:linear-gradient(#34343f,#1c1c25)}
.carta.runa .art{align-items:center;background:radial-gradient(ellipse at 50% 45%,#3d3d49,#1a1a21 78%)}
.carta.runa .art::before{background:repeating-linear-gradient(45deg,#ffffff0a 0 3px,#00000016 3px 6px);filter:none;opacity:1}
.carta.runa .art .rn-ic{position:relative;z-index:1;width:64px;height:64px;image-rendering:pixelated;filter:drop-shadow(0 0 7px var(--rc)) drop-shadow(0 3px 2px #000a)}
.carta.runa .rn-pie{flex:none;height:42px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 6px;background:linear-gradient(#1d1c26,#101016);border-top:1px solid #000}
.carta.runa .rn-tag{font:700 9px Cinzel,serif;letter-spacing:.16em;text-transform:uppercase;color:var(--rc)}
.carta.runa .rn-ef{font:9.5px/1.2 Verdana;color:#cfc9b4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.carta.runa .rn-badge{display:none;position:absolute;left:2px;top:2px;z-index:2;font:700 7px Cinzel,serif;letter-spacing:.1em;background:#000b;color:var(--rc);padding:0 3px;border-radius:2px;border:1px solid #4a4a58}
.carta.runa.pobre .rn-ic{filter:grayscale(.6) brightness(.8) drop-shadow(0 3px 2px #000a)}
#runas{display:flex;align-items:center;gap:3px;margin-top:4px;padding:2px 4px;background:#0b0c12;border:1px solid #2f2a18;border-radius:3px}
#runas .rn-t{font:700 8px Cinzel,serif;letter-spacing:.06em;color:#9a957f;text-transform:uppercase;line-height:1.05;margin-right:2px;flex:1;min-width:0}
.rn-s{--rc:#b9b3c9;width:28px;height:28px;flex:none;box-sizing:border-box;border-radius:4px;background:#07080d;border:1px dashed #3a3624;padding:0;display:flex;align-items:center;justify-content:center;position:relative;color:inherit}
.rn-s.cheio{border:1px solid #7a7a86;background:linear-gradient(#2a2a33,#131318);cursor:pointer;touch-action:none}
.rn-s img{width:24px;height:24px;image-rendering:pixelated;pointer-events:none}
.rn-s.cheio:hover{border-color:#e6d27a}
.rn-s.sel{border-color:#9fd8ff;box-shadow:0 0 7px #6fb8ffaa}
.rn-s.arm{border-color:var(--rc);box-shadow:0 0 6px var(--rc),inset 0 0 5px color-mix(in srgb,var(--rc) 55%,transparent)}
.rn-s.arm::after{content:'';position:absolute;right:-2px;top:-2px;width:7px;height:7px;border-radius:50%;background:#ffe27a;border:1px solid #000}
#runarm{display:flex;gap:3px;align-items:center}#runarm:empty{display:none}
#runarm .rn-s{width:26px;height:26px;border-radius:50%;cursor:pointer}#runarm .rn-s img{width:20px;height:20px}
#runas-dica{color:#9fd8ff}
.rn-det{display:flex;gap:14px;align-items:center;margin:8px 0}.rn-det img{width:96px;height:96px;image-rendering:pixelated;flex:none;filter:drop-shadow(0 0 10px var(--rc))}.rn-det p{margin:0 0 6px}
.poder-info{max-width:380px;margin:-6px auto 12px;text-align:left;font:11px/1.45 Verdana,sans-serif;color:#c9c4ad;background:#0b0d14;border:1px solid #3a321c;border-radius:3px;padding:7px 10px}
.poder-info b{color:var(--ouro);font-family:Cinzel,serif}.poder-info .pc{color:#b2a26b}.poder-info p{margin:3px 0 0}
#odds{margin-bottom:2px}
#odds .oh{display:flex;justify-content:space-between;font:700 9px Cinzel,serif;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
#odds .oh b{color:#f3e6b4}
#odds .ob{display:flex;height:7px;border:1px solid #000;border-radius:2px;overflow:hidden;background:#05060a;box-shadow:0 0 0 1px #3a321c}
#odds .ob i{display:block;height:100%}
#odds .on_{display:flex;margin-top:2px}
#odds .on_ b{flex:1;text-align:center;font:700 9.5px Verdana;text-shadow:0 1px 0 #000}
#odds .on_ b.z{opacity:.32;font-weight:400}
/* área de venda: a loja vira uma zona vermelha ao arrastar uma unidade */
#zona-venda{position:absolute;inset:0;border-radius:3px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3px;z-index:5;pointer-events:none;border:2px solid #e0574a;
  background:repeating-linear-gradient(-45deg,#4a120d 0 14px,#3a0d09 14px 28px);box-shadow:inset 0 0 40px #e0574a88,0 0 18px #e0574a77}
#zona-venda.on{display:flex;animation:vendaPulso 1s ease-in-out infinite}
#zona-venda.sobre{background:repeating-linear-gradient(-45deg,#6e1a12 0 14px,#55130d 14px 28px);box-shadow:inset 0 0 60px #ff7a5ccc,0 0 26px #ff6a5acc;border-color:#ffb0a0}
#zona-venda .vt{font:700 12px Cinzel,serif;color:#ffd0c6;letter-spacing:.3em;text-transform:uppercase;text-shadow:0 2px 0 #000}
#zona-venda .vv{display:flex;align-items:center;gap:8px;font:700 28px Cinzel,serif;color:#fff1c4;text-shadow:0 2px 0 #000,0 0 14px #e0574a}
#zona-venda .vv img{width:30px;height:30px}
@keyframes vendaPulso{0%,100%{border-color:#e0574a}50%{border-color:#ff9a88}}
/* ---------- painel flutuante da carta (aparece acima dela quando o mouse a levanta) ---------- */
#cpainel{position:fixed;z-index:70;display:none;pointer-events:none;width:296px;padding:9px 11px 10px;background:linear-gradient(180deg,#1f2333,#0d0f17);border:1px solid var(--ouro2);border-radius:4px;box-shadow:inset 0 0 0 1px #05060a,0 8px 26px #000d;font-size:10.5px;line-height:1.4;color:#d4cdb4}
#cpainel.on{display:block;animation:cpIn .12s ease-out both}
#cpainel::after{content:'';position:absolute;left:var(--ax,50%);bottom:-7px;width:12px;height:12px;background:#0d0f17;border-right:1px solid var(--ouro2);border-bottom:1px solid var(--ouro2);transform:translateX(-50%) rotate(45deg)}
@keyframes cpIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
:where(#cpainel,.detalhe-unidade) .cab{display:flex;align-items:center;gap:8px}
:where(#cpainel,.detalhe-unidade) .cab h4{margin:0;flex:1;font:700 15px Cinzel,serif;color:var(--ouro);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:where(#cpainel,.detalhe-unidade) .cab .cus{display:flex;align-items:center;gap:3px;font:700 14px Cinzel,serif;color:#fff1c4}
:where(#cpainel,.detalhe-unidade) .cab .cus img{width:16px;height:16px}
:where(#cpainel,.detalhe-unidade) .sub{font:10px Verdana;color:var(--mut);margin:1px 0 0;letter-spacing:.04em}
:where(#cpainel,.detalhe-unidade) .st{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:7px 0 6px}
:where(#cpainel,.detalhe-unidade) .st div{display:flex;align-items:center;gap:5px;background:#0a0c13;border:1px solid #2a2616;border-radius:3px;padding:3px 5px}
:where(#cpainel,.detalhe-unidade) .st svg{width:15px;height:15px;flex:none}
:where(#cpainel,.detalhe-unidade) .st b{display:block;font:700 12px/1 Cinzel,serif;color:#fff1c4}
:where(#cpainel,.detalhe-unidade) .st small{display:block;font:8px Verdana;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
:where(#cpainel,.detalhe-unidade) .hab{padding-top:6px;border-top:1px solid #3a321c}
:where(#cpainel,.detalhe-unidade) .hab .pm{font:700 12.5px Verdana;color:#ffe14a;text-shadow:0 1px 0 #000}
:where(#cpainel,.detalhe-unidade) .hab .tp{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid #6b5a2e;border-radius:8px;font:700 9px Cinzel,serif;color:var(--ouro);letter-spacing:.06em;text-transform:uppercase;vertical-align:1px}
:where(#cpainel,.detalhe-unidade) .hab p{margin:3px 0 0;color:#d4cdb4}
:where(#cpainel,.detalhe-unidade) .sn{margin-top:7px;padding-top:6px;border-top:1px solid #3a321c}
:where(#cpainel,.detalhe-unidade) .sn .lin{display:flex;align-items:center;gap:8px;padding:1px 0}
:where(#cpainel,.detalhe-unidade) .sn .ti{--s:30px}
:where(#cpainel,.detalhe-unidade) .sn .nm{font:700 12.5px Cinzel,serif;color:#f0e8cc;flex:1}
:where(#cpainel,.detalhe-unidade) .sn .pp{min-width:15px;height:14px;font-size:9px}
:where(#cpainel,.detalhe-unidade) .sn .ct{font:700 13px Cinzel,serif;color:#fff1c4;white-space:nowrap}
:where(#cpainel,.detalhe-unidade) .sn .ct i{font-style:normal;color:#9a957f;padding:0 3px}
:where(#cpainel,.detalhe-unidade) .sn .ct u{text-decoration:none;font:700 9px Cinzel,serif;color:#1b1400;background:#ffd95a;border-radius:8px;padding:0 5px;margin-left:5px;text-transform:uppercase;letter-spacing:.04em}
:where(#cpainel,.detalhe-unidade) .dica-up{margin-top:6px;padding-top:5px;border-top:1px solid #3a321c;color:#ffe27a;font-weight:700}
/* ---------- tooltip ---------- */
#tip{position:fixed;z-index:60;display:none;pointer-events:none;max-width:290px;min-width:190px;background:linear-gradient(180deg,#1b1e2c,#0d0f17);border:1px solid var(--ouro2);box-shadow:inset 0 0 0 1px #05060a,0 6px 20px #000d;border-radius:3px;padding:8px 10px;font-size:10.5px;line-height:1.45}
#tip h4{margin:0 0 3px;font:700 13px Cinzel,serif;color:var(--ouro);letter-spacing:.03em;display:flex;justify-content:space-between;gap:10px}
#tip .sb{color:var(--mut);font-size:10px;margin-bottom:5px}
#tip .lin{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #2a2616;padding:1px 0}
#tip .lin b{color:#f3e6b4;font-weight:400}
#tip .hab{margin-top:5px;padding-top:4px;border-top:1px solid #3a321c;color:#d4cdb4}
#tip .hab i{color:#ffe14a;font-style:normal;font-weight:700}
#tip .its{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
#tip .its img{width:26px;height:26px;background:#07080d;border:1px solid #3a321c}
#tip .its.l{flex-direction:column;gap:2px}
#tip .its.l div{display:flex;gap:6px;align-items:center}
#tip .its.l img{width:22px;height:22px}
#tip .est{color:#d4d8e2;letter-spacing:2px;font-size:17px;line-height:1;text-shadow:0 1px 0 #000,0 0 3px #000}#tip .est.e2{color:#bfe0ff}#tip .est.e3{color:#ffd24a;text-shadow:0 1px 0 #000,0 0 8px rgba(255,210,70,.85)}
#tip .tg{display:inline-flex;align-items:center;gap:4px;padding:1px 7px 1px 2px;border:1px solid #3a321c;border-radius:3px;margin:0 3px 2px 0;color:#e6d9ab;background:#0b0d14;font:700 11px Cinzel,serif}
#tip .tg .ti{--s:30px}
#tip .tg.on{border-color:var(--ouro2);color:var(--ouro)}
/* ---------- telas (menu, resultado, fim) ---------- */
#tela{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#05060acc 0%,#05060aee 100%)}
#tela.on{display:flex}
#tela.leve{background:#05060a55;backdrop-filter:blur(1px)}
.modal{width:min(660px,94vw);max-height:92vh;overflow:auto;padding:22px 26px;text-align:center}
.modal h1{font:400 60px MedievalSharp,Cinzel,serif;color:var(--ouro);margin:2px 0 0;text-shadow:0 0 28px #d9b45a66,0 3px 0 #000;letter-spacing:.04em;line-height:1.05}
.modal .sub{font:700 12px Cinzel,serif;color:var(--mut);letter-spacing:.34em;text-transform:uppercase;margin-bottom:20px}
.modal h2{font:700 22px Cinzel,serif;color:var(--ouro);margin:0 0 12px;letter-spacing:.08em;border:0}
.modal .menu{display:flex;flex-direction:column;gap:8px;max-width:270px;margin:0 auto}
.modal .menu .bt{font-size:15px;padding:10px}
.modal .txt{text-align:left;font-size:11.5px;line-height:1.6;color:#d4cdb4}
.modal .txt h3{font:700 12px Cinzel,serif;color:var(--ouro);margin:12px 0 3px;letter-spacing:.08em;text-transform:uppercase}
.modal .txt p{margin:0 0 4px}
.modal .txt kbd{background:#0b0d14;border:1px solid #6b5a2e;border-radius:2px;padding:0 5px;color:var(--ouro);font:700 10px Verdana}
.herois{display:flex;justify-content:center;gap:8px;margin:0 0 16px}
.heroi{width:74px;border:1px solid #3a321c;background:#0b0d14;border-radius:3px;padding:4px 2px 5px;cursor:pointer;font:700 9.5px Cinzel,serif;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.heroi.sel{border-color:var(--ouro);color:var(--ouro);background:linear-gradient(#241d0c,#11131c);box-shadow:0 0 10px #d9b45a44}
.heroi canvas{width:56px;height:56px;display:block;margin:0 auto 2px}

/* ---------- nova tela inicial ---------- */
.menu-ini{position:relative;z-index:1}
.modal h1.logo-t{display:table;margin:2px auto 0;background:linear-gradient(100deg,#d9b45a 0%,#d9b45a 40%,#fff6c8 50%,#d9b45a 60%,#d9b45a 100%) 120% 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:brilhoLogo 5.5s linear infinite,pulsoLogo 3.6s ease-in-out infinite}
@keyframes brilhoLogo{0%,30%{background-position:120% 0}100%{background-position:-120% 0}}
@keyframes pulsoLogo{0%,100%{filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 8px #d9b45a44)}50%{filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 22px #d9b45acc)}}
.sub-ini{animation:subEntra 1.6s .4s both}
@keyframes subEntra{from{opacity:0;letter-spacing:.6em}to{opacity:1}}
.palco{display:flex;align-items:center;gap:14px;margin:0 0 10px;padding:10px 12px;text-align:left;background:radial-gradient(ellipse at 18% 55%,#33290eee,#0b0d14 72%);border:1px solid #6b5a2e;border-radius:4px;box-shadow:inset 0 0 24px #000a,0 0 18px #d9b45a22}
.palco-cv{flex:none;width:128px;height:128px;background:radial-gradient(ellipse at 50% 86%,#e6c25a44,transparent 62%)}
.palco-cv canvas{width:128px;height:128px;display:block;filter:drop-shadow(0 4px 3px #000)}
.palco-tx{min-width:0;flex:1}
.palco-nome{font:700 26px Cinzel,serif;color:var(--ouro);letter-spacing:.12em;text-transform:uppercase;line-height:1.1;text-shadow:0 2px 0 #000,0 0 14px #d9b45a55}
.palco-fr{font:italic 11.5px/1.4 Verdana,sans-serif;color:#d4cdb4;margin:2px 0 8px}
.palco .poder-info{max-width:none;margin:0}
.ouro-i{width:12px;height:12px;vertical-align:-2px;margin:0 1px}
.palco.troca{animation:palcoBrilho .6s ease-out}
.palco.troca .palco-cv canvas{animation:herSobe .5s cubic-bezier(.2,1.5,.4,1)}
.palco.troca .palco-tx{animation:herTx .4s both}
@keyframes palcoBrilho{0%{box-shadow:inset 0 0 24px #000a,0 0 40px #ffe27acc}100%{box-shadow:inset 0 0 24px #000a,0 0 18px #d9b45a22}}
@keyframes herSobe{0%{transform:scale(.6) translateY(14px);filter:brightness(2.6)}100%{transform:none;filter:drop-shadow(0 4px 3px #000)}}
@keyframes herTx{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.heroi{transition:border-color .15s,transform .15s}.heroi:hover{border-color:#6b5a2e;transform:translateY(-2px)}
.heroi.sel canvas{animation:heroiPula 1.8s ease-in-out infinite}
@keyframes heroiPula{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.menu-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
.menu-stats div{background:#0b0d14;border:1px solid #3a321c;border-radius:3px;padding:5px 2px}
.menu-stats b{display:block;font:700 17px Cinzel,serif;color:#f3e6b4;line-height:1.2}
.menu-stats span{display:block;font-size:8.5px;line-height:1.2;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.modal .menu.menu-p{display:grid;grid-template-columns:1fr 1fr;max-width:340px;gap:8px}
.menu-p #b-jogar{grid-column:1/-1;font:700 24px Cinzel,serif;letter-spacing:.32em;padding:14px 10px;text-transform:uppercase;text-indent:.32em;animation:pulsoJogar 2.4s ease-in-out infinite}
.menu-p #b-tela{grid-column:1/-1}
@keyframes pulsoJogar{0%,100%{box-shadow:0 0 6px #d9b45a44}50%{box-shadow:0 0 22px #d9b45ac0}}
.brasas{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.brasas i{position:absolute;bottom:-12px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:#ffc866;box-shadow:0 0 6px 2px #ff9a3a99;opacity:0;animation:brasa var(--d) var(--a) linear infinite}
@keyframes brasa{0%{transform:translate(0,0);opacity:0}12%{opacity:.9}100%{transform:translate(var(--dx),-108vh);opacity:0}}
html.reduz .brasas{display:none}
#tela.menu{background:radial-gradient(ellipse at center,#05060a44 0%,#05060a77 55%,#020305c8 100%);backdrop-filter:blur(2px)}
#app.menu #cvw{overflow:hidden}
#app.menu #cv{animation:panMenu 40s ease-in-out infinite alternate}
@keyframes panMenu{from{transform:scale(1.02) translate(-6px,2px)}to{transform:scale(1.09) translate(8px,-6px)}}
.prog{width:260px;margin:0 auto 14px}
.rec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.rec div{background:#0b0d14;border:1px solid #3a321c;border-radius:3px;padding:8px 4px}
.rec b{display:block;font:700 22px Cinzel,serif;color:#f3e6b4}
.rec span{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.hist{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.hist i{font:700 12px Cinzel,serif;font-style:normal;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid #3a321c;background:#0b0d14;color:var(--mut);border-radius:2px}
.hist i.top{color:#fff1c4;border-color:var(--ouro)}
.hist i.win{background:#3a2c0e;color:#ffe9a0;border-color:#e6d27a}
.colocacao{font:400 70px MedievalSharp,serif;line-height:1;margin:2px 0 4px}
.carr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}

.carr .ci:hover{transform:translateY(-3px);filter:brightness(1.3)}
.carr .ci .ic{display:block;margin:0 auto 6px}.carr .ci .ic.x2{margin-bottom:8px}
.carr .ci b{display:block;font:700 10.5px Cinzel,serif;color:#f1e8cc;min-height:26px}
.carr .ci span{font-size:9.5px;color:#a9a48f;line-height:1.35;display:block}
@media (max-width:1100px){#app{grid-template-columns:214px minmax(0,1fr) 190px}#base{grid-template-columns:180px minmax(0,1fr) 170px}.carta .tr{display:none}}

/* ---------- bênçãos: escolha 1 de 3 (Prata / Ouro / Prismática) ---------- */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
#bencao{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#05060acc 0%,#05060af0 100%);padding:8px}

@keyframes bn-ent{from{opacity:0}to{opacity:1}}
#bencao.sai{animation:bn-sai .36s ease-in forwards;pointer-events:none}
@keyframes bn-sai{to{opacity:0;transform:scale(1.04)}}
.bn-caixa{width:min(1000px,96vw);max-height:calc(100dvh - 16px);overflow:auto;display:flex;flex-direction:column;gap:12px;text-align:center}
.bn-cab .eyebrow{display:block;font:700 12px Cinzel,serif;letter-spacing:.3em;text-transform:uppercase;color:var(--tc)}

function mulberry(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}

function embaralhar(a,r){r=r||rnd;for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function semente(s){RNG=mulberry(s);}

/* =====================================================================================
   ITENS (ícones reais 15.01). Fase 2: 8 componentes -> 36 itens completos (receitas) -> forja (+1 a +3) -> encantamentos.
   Um item no inventário ou na unidade é um CÓDIGO inteiro: id + 100000*forja + 1000000*encantamento.
   Assim ele cabe em JSON, nos snapshots do online e em comparações simples (===); o motor lê tudo por itemInfo(código).
   ===================================================================================== */
const ITF=100000,ITM=1000000;
