function criarCombate(eqA,eqB,o){o=o||{};
  const seed=(o.seed!==undefined?o.seed:sementeLuta())>>>0;   // todo o sorteio do combate sai daqui: mesmas equipes + mesma semente = mesma luta
  const C={seed,r:mulberry(seed),esp:false,t:0,tk:0,un:[],occ:new Int16Array(NC*NR),map:{},uid:0,ev:[],vis:!!o.vis,fim:false,venc:-2,vivos:[0,0],
    semSalto:!!o.semSalto,sd:0,tr:[{},{}],niv:[{},{}],mortos:[],fx:[],tiros:[],txts:[],falas:[],dano:[0,0],cura:[0,0],curaMul:[1,1],tempoMax:o.tempoMax||40000,pve:!!o.pve,imp:[]};
  [eqA,eqB].forEach((eq,lado)=>{
    C.tr[lado]=contarTracos(eq.un.filter(s=>!s.inv&&!s.d.pve).map(s=>s.d.id));
    Object.keys(C.tr[lado]).forEach(t=>{C.niv[lado][t]=nivelTraco(t,C.tr[lado][t]);});
    eq.un.forEach(s=>{const u=novoUnit(C,s,lado);if(s.esc)u.escPoder=true;if(s.ru&&s.ru.length)u.runas=s.ru;});});
  aplicarTracos(C);
  C.un.forEach(u=>{u.hp=u.hpM;});
  // efeitos de itens que valem desde o início da luta: escudo (Blessed Shield), furtividade (Stealth Ring) e aura de armadura (Royal Helmet)
  C.un.forEach(u=>{const ie=u.ie;
    if(ie.escIni){darEscudo(C,u,u.hpM*ie.escIni,8000);fx(C,'magic_blue',u.x,u.y);}
    if(ie.furtivo)u.furtivoAte=ie.furtivo;
    if(ie.auraArm)C.un.forEach(v=>{if(v!==u&&v.lado===u.lado&&cheb(u,v)<=1)v.arm+=ie.auraArm;});});
  // bênçãos de combate (vêm em eq.bn, então host e convidados simulam o mesmo): 5 vida, 6 vel. de ataque, 10 fúria, 11 último suspiro, 15 ascensão, 18 regeneração
  [eqA,eqB].forEach((eq,lado)=>{const bn=eq.bn;if(!bn||!bn.length)return;const meus=C.un.filter(u=>u.lado===lado&&!u.inv&&!u.pve);
    if(bn.includes(5))meus.forEach(u=>{u.hpM=Math.round(u.hpM*(1+BN.pele));u.hp=u.hpM;});
    if(bn.includes(6))meus.forEach(u=>{u.asB+=BN.mao;});
    if(bn.includes(18))meus.forEach(u=>{u.regen+=BN.reg;});
    if(bn.includes(10)){let n=0;const f=()=>{n++;meus.forEach(u=>{u.dmgB+=BN.furia;});if(n<BN.furiaMax)agendar(C,BN.furiaT,f);};agendar(C,BN.furiaT,f);}
    if(bn.includes(15))agendar(C,BN.ascT,()=>{meus.forEach(u=>{u.dmgB+=BN.asc;});});
    if(bn.includes(11)){if(!C.sus)C.sus=[0,0];C.sus[lado]=1;}});      // 1 = ainda não explodiu
  // runas armadas (vêm no spec: s.ru na unidade, eq.ru no time; eq.re = estágio, que escala o dano)
  C.un.forEach(u=>{if(u.runas)u.runas.forEach(k=>runaUn(C,u,k));});
  [eqA,eqB].forEach((eq,lado)=>{if(eq.ru&&eq.ru.length)eq.ru.forEach(k=>runaTime(C,lado,k,escRn(eq.re)));});
  // poderes das vocações: passivos + cargas do ativo (vêm no spec da equipe, então host e convidados simulam o mesmo)
  [eqA,eqB].forEach((eq,lado)=>{const voc=eq.voc;if(!voc)return;const meus=C.un.filter(u=>u.lado===lado&&!u.inv&&!u.pve);
    if(voc==='knight')meus.forEach(u=>{if(u.y===(lado===0?TAB_Y:3)){u.arm+=PODN.frente;u.rm+=PODN.frente;}});             // Linha de Frente
    if(voc==='paladin')meus.forEach(u=>{if(u.al>=3)u.dmgB+=PODN.olho;});                                                 // Olho de Águia
    if(voc==='sorcerer')meus.forEach(u=>{if(u.manaM)u.mana=Math.min(u.manaM,u.mana+PODN.mana);});                        // Fluxo Arcano
    if(voc==='druid')C.curaMul[lado]=1+PODN.cura;                                                                         // Seiva
    meus.forEach(u=>{if(u.escPoder){darEscudo(C,u,u.hpM*PODN.escudo,99999);fx(C,'magic_blue',u.x,u.y);}});               // Utamo Tempo
    if(eq.sd)agendar(C,PODN.sdT,()=>{let al=null;C.un.forEach(u=>{if(u.vivo&&u.lado!==lado&&!u.inv&&(!al||u.hp>al.hp))al=u;});   // Runa SD: maior vida atual, empate = primeira unidade
      if(!al)return;tiro(C,'suddendeath',{x:al.x,y:al.y-5},al);fx(C,'mortarea',al.x,al.y);fx(C,'explosionarea',al.x,al.y,60);causar(C,null,al,al.hpM*PODN.sd,'death',{magia:true,sem:true,crit:true});});});
  return C;}

/* ---- runas ---- */
/* runas de unidade: UH (flag lida em causar), Magic Wall (imunidade lida em causar) e Haste (buff 'ace', lido em asEff/movEff) */
function runaUn(C,u,k){const R=RN;
  if(k===1)u.uh=true;
  else if(k===6){u.muroAte=R.mw.dur;agendar(C,150,()=>{if(!u.vivo)return;fx(C,'magic_blue',u.x,u.y);txt(C,u.x,u.y-.5,'Magic Wall','#6fb8ff');});}
  else if(k===7){u.b.ace={ate:R.hs.dur,v:R.hs.ace};agendar(C,150,()=>{if(!u.vivo)return;fx(C,'magic_green',u.x,u.y);txt(C,u.x,u.y-.5,'Haste','#7dff9a');});}}
/* centro da explosão: a casa com mais inimigos no raio 1 (desempate: mais vida somada; depois a primeira da varredura) */
function centroRuna(C,lado){let b=null,bn=-1,bh=-1;
  for(let y=0;y<NR;y++)for(let x=0;x<NC;x++){let n=0,h=0;C.un.forEach(v=>{if(v.vivo&&v.lado!==lado&&cheb({x,y},v)<=1){n++;h+=v.hp;}});if(n>bn||(n===bn&&h>bh)){bn=n;bh=h;b=[x,y];}}
  return bn>0?b:null;}
function areaRuna(C,lado,cx,cy,dano,el,ef,f){const atingidos=[];
  for(let y=cy-1;y<=cy+1;y++)for(let x=cx-1;x<=cx+1;x++){if(!dentro(x,y))continue;fx(C,ef,x,y,((x+y)&1)*40);
    const id=C.occ[y*NC+x],v=id&&C.map[id];if(v&&v.vivo&&v.lado!==lado){causar(C,null,v,dano,el,{magia:true,sem:true,rn:true});atingidos.push(v);if(f&&v.vivo)f(v);}}
  return atingidos;}
/* runas sem alvo: agendadas no tempo certo para o time; src = null (dano "do ambiente", sem crédito no placar) */
function runaTime(C,lado,k,es){const R=RN,inim=()=>C.un.filter(v=>v.vivo&&v.lado!==lado);
  if(k===2)agendar(C,R.sd.t,()=>{let al=null;inim().forEach(u=>{if(!al||u.hp>al.hp)al=u;});if(!al)return;   // Sudden Death: maior vida atual (empate: a primeira unidade)
    tiro(C,'suddendeath',{x:al.x,y:al.y-5},al);fx(C,'mortarea',al.x,al.y);fx(C,'explosionarea',al.x,al.y,60);txt(C,al.x,al.y-.5,'Sudden Death','#d8d2ee');causar(C,null,al,al.hpM*R.sd.p,'death',{magia:true,sem:true,crit:true,rn:true});});
  else if(k===3)agendar(C,R.gfb.t,()=>{const c=centroRuna(C,lado);if(!c)return;txt(C,c[0],c[1]-.5,'Great Fireball','#ffa040');fx(C,'explosionarea',c[0],c[1]);areaRuna(C,lado,c[0],c[1],R.gfb.d*es,'fire','firearea');});
  else if(k===4)agendar(C,R.ava.t,()=>{const c=centroRuna(C,lado);if(!c)return;txt(C,c[0],c[1]-.5,'Avalanche','#7fd4ff');
    areaRuna(C,lado,c[0],c[1],R.ava.d*es,'ice','icearea',v=>aplicarDeb(C,v,{lento:R.ava.lento,dur:R.ava.dur}));});
  else if(k===5)agendar(C,R.par.t,()=>{let al=null;inim().forEach(u=>{if(!al||u.atk>al.atk)al=u;});if(!al)return;   // Paralyze: maior ataque
    fx(C,'purpleenergy',al.x,al.y);txt(C,al.x,al.y-.5,'Paralyze','#c9a0ff');atordoar(C,al,R.par.stun);});
  else if(k===8)agendar(C,R.eb.t,()=>{const ini=inim();if(!ini.length)return;   // Energy Bomb: campo 3x3 no centro do exército inimigo; 1 tique por segundo
    let sx=0,sy=0;ini.forEach(v=>{sx+=v.x;sy+=v.y;});const cx=clamp(Math.round(sx/ini.length),1,NC-2),cy=clamp(Math.round(sy/ini.length),1,NR-2);
    txt(C,cx,cy-.5,'Energy Bomb','#d58cff');
    const tique=n=>{areaRuna(C,lado,cx,cy,R.eb.d*es,'energy','energyarea');if(n<R.eb.n)agendar(C,1000,()=>tique(n+1));};tique(1);});}

/* soma as estatísticas de um item (já com forja e encantamento) na unidade; os efeitos marcantes ficam em u.ie e são lidos pelo motor */
const EFK=FX_ORD.concat(['pen']);
function aplicarItem(u,code){const it=itemInfo(code);if(!it||it.perg)return;const S=it.s;
  if(S.atk)u.atk=Math.round(u.atk*(1+S.atk));if(S.as)u.asB+=S.as;if(S.ap)u.ap+=S.ap;if(S.arm)u.arm+=S.arm;
  if(S.hp){u.hp+=S.hp;u.hpM+=S.hp;}if(S.regen)u.regen+=S.regen;if(S.m0)u.mana=Math.min(u.manaM||999,u.mana+S.m0);
  if(S.mov)u.mov+=S.mov;if(S.crit)u.crit+=S.crit;if(S.roubo)u.roubo+=S.roubo;if(S.rouboM)u.rouboM+=S.rouboM;if(S.mreg)u.mreg+=S.mreg;
  if(S.red)u.recMul=Math.max(.5,u.recMul*(1-S.red));if(S.rm)u.rm+=S.rm;if(S.esq)u.esq=Math.min(.6,u.esq+S.esq);if(S.queima)u.queima+=S.queima;
  if(S.alc&&u.al>=2)u.al=Math.min(u.d.al+1,u.al+S.alc);if(S.resFogo)u.res.fire=(u.res.fire||0)+S.resFogo;if(S.salta)u.salta=true;
  EFK.forEach(k=>{if(S[k])u.ie[k]=(u.ie[k]||0)+S[k];});
  if(it.res)for(const e in it.res)u.res[e]=(u.res[e]||0)+it.res[e];
  if(it.conv)(u.convs=u.convs||[]).push(it.conv);}
function novoUnit(C,s,lado){const d=s.d,e=s.e||1,st=statsDe(d,e);
  const u={uid:++C.uid,d,e,lado,x:s.x,y:s.y,fx:s.x,fy:s.y,t0:-99999,dur:0,andaDesde:0,dir:lado===0?0:2,hp:st.hp,hpM:st.hp,atk:st.atk,sk:st.sk,arm:d.arm,al:d.al,as:d.as,
    mov:1,mana:d.m0||0,manaM:d.hab?d.mana:0,ap:0,asB:0,dmgB:0,crit:0,esq:0,roubo:0,rouboM:0,ie:{},convs:null,nAt:0,furtivoAte:0,regen:0,mreg:0,recMul:1,rm:d.rm===undefined?15:d.rm,res:{},armMul:1,hab:d.hab,
    vivo:true,alvo:null,prox:0,livreEm:0,stunAte:0,b:{},dots:[],itens:s.itens||[],inv:!!s.inv,el:d.el||'phys',
    C,queima:0,estunaChance:0,fatEsp:0,orcFuria:0,furia:false,morteFogo:0,nome:d.nome,lunge:null,pve:!!d.pve,inst:s.inst||null,st:{d:0,r:0,c:0}};   // st = placar: dano causado, recebido e cura feita
  if(d.pve&&d.mana===undefined){u.manaM=d.hab?60:0;u.mana=d.hab?20:0;}
  if(d.pve&&d.hab)u.manaM=70;
  // itens (receitas, forja e encantamentos): as estatísticas vêm de itemInfo(código)
  u.itens.forEach(c=>aplicarItem(u,c));
  if(u.ie.manaRed&&u.manaM){u.manaM=Math.max(20,Math.round(u.manaM*(1-Math.min(.5,u.ie.manaRed))));u.mana=Math.min(u.mana,u.manaM);}
  if(s.hpMul){u.hp=u.hpM=Math.round(u.hpM*s.hpMul);u.atk=Math.round(u.atk*(s.atMul||s.hpMul));u.sk=Math.round(u.sk*(s.atMul||s.hpMul));}
  C.un.push(u);C.map[u.uid]=u;C.occ[u.y*NC+u.x]=u.uid;C.vivos[lado]++;return u;}

/* ---- sinergias ativas -> bônus nas unidades ---- */
function aplicarTracos(C){
  for(let lado=0;lado<2;lado++){const N=C.niv[lado],cnt=C.tr[lado],meus=C.un.filter(u=>u.lado===lado),inim=C.un.filter(u=>u.lado!==lado);
    const L=t=>N[t]===undefined?-1:N[t];
    const mem=(t,f)=>meus.forEach(u=>{if(!u.inv&&!u.pve&&(u.d.o===t||u.d.k===t))f(u);});
    let n;
    if((n=L('guardiao'))>=0){const v=[15,35,60][n];meus.forEach(u=>{u.arm+=u.d.k==='guardiao'&&!u.inv?v*2:v;});}
    if((n=L('guerreiro'))>=0){const v=[.20,.40,.65][n];mem('guerreiro',u=>{u.dmgB+=v;u.roubo+=v*.6;});}
    if((n=L('atirador'))>=0){const v=[.25,.60][n];mem('atirador',u=>{u.asB+=v;});}
    if((n=L('mago'))>=0){const v=[.2,.5,.9][n];mem('mago',u=>{u.ap+=v;});}
    if((n=L('curandeiro'))>=0)C.curaTime=C.curaTime||[0,0],C.curaTime[lado]=[.01,.03][n];   // etapa 4: era 2%/5% (curandeiros dominavam)
    if((n=L('assassino'))>=0){const v=[.15,.35][n];mem('assassino',u=>{u.crit+=v;u.salta=true;});}
    if((n=L('invocador'))>=0)C.invMul=C.invMul||[1,1],C.invMul[lado]=[1.5,2][n];
    if((n=L('humano'))>=0){const v=[25,50,80][n];mem('humano',u=>{u.mana=Math.min(u.manaM||999,u.mana+v);});}
    if((n=L('orc'))>=0){const v=[.5,1.0][n];mem('orc',u=>{u.orcFuria=v;});}
    if((n=L('anao'))>=0){const v=[300,700][n];mem('anao',u=>{u.hpM+=Math.round(v*VIDA_LUTA);});}
    if((n=L('elfo'))>=0){const v=[.20,.35][n];mem('elfo',u=>{u.esq+=v;});}
    if((n=L('morto'))>=0){const v=[.2,.4,.6][n];inim.forEach(u=>{u.armMul*=1-v;});}
    if((n=L('fera'))>=0){const a=[.20,.40][n],b=[.15,.30][n];mem('fera',u=>{u.asB+=a;u.dmgB+=b;});}
    if((n=L('dragao'))>=0){const v=[.20,.30,.40][n],x=[1.5,2.5,3.5][n];mem('dragao',u=>{u.res.fire=(u.res.fire||0)+v;u.morteFogo=x;});}
    if((n=L('demonio'))>=0){const v=[15,30][n];mem('demonio',u=>{u.queima+=v;});}
    if((n=L('elemental'))>=0){const v=[.15,.35][n];mem('elemental',u=>{u.dmgB+=v;u.ap+=v;});}
    if((n=L('gigante'))>=0){const v=[.12,.22][n];mem('gigante',u=>{u.estunaChance=v;});}
    if((n=L('minotauro'))>=0){mem('minotauro',u=>{u.hpM=Math.round(u.hpM*1.3);});}
  }
  // assassinos saltam para a retaguarda inimiga
  if(!C.semSalto)embaralhar(C.un.filter(u=>u.salta),C.r).forEach(u=>saltar(C,u));
}
function saltar(C,u){const ini=C.un.filter(v=>v.lado!==u.lado&&v.vivo);if(!ini.length)return;
  // inimigo mais ao fundo (lado A salta para y baixo, lado B para y alto)
  let alvo=null,mel=-1e9;ini.forEach(v=>{const prof=u.lado===0?-v.y:v.y;if(prof>mel||(prof===mel&&C.r()<.5)){mel=prof;alvo=v;}});
  let melhor=null,ms=-1e9;
  for(const [dx,dy] of DIR8){const x=alvo.x+dx,y=alvo.y+dy;if(!dentro(x,y)||C.occ[y*NC+x])continue;const s=(u.lado===0?-y:y)*10+C.r();if(s>ms){ms=s;melhor=[x,y];}}
  if(!melhor)return;
  fx(C,'teleport',u.x,u.y);C.occ[u.y*NC+u.x]=0;u.x=u.fx=melhor[0];u.y=u.fy=melhor[1];C.occ[u.y*NC+u.x]=u.uid;fx(C,'teleport',u.x,u.y,100);u.alvo=alvo;u.prox=100;}

/* ---- saídas visuais (só no modo com render) ---- */
function fx(C,nome,x,y,atraso){if(!C.vis)return;const id=typeof nome==='number'?nome:E(nome);if(!id||!CB.efeitos[id])return;C.fx.push({id,x,y,b:C.t+(atraso||0)});if(C.fx.length>400)C.fx.splice(0,C.fx.length-400);}
function tiro(C,nome,a,b){const id=AN(nome);const d=(id&&CB.tiros[id])?Math.round(130*Math.sqrt(Math.sqrt((b.x-a.x)*(b.x-a.x)+(b.y-a.y)*(b.y-a.y)))):0;
  if(C.vis&&d)C.tiros.push({id,x1:a.x,y1:a.y,x2:b.x,y2:b.y,b:C.t,dur:d});return d||120;}
function txt(C,x,y,t,cor,g){if(!C.vis)return;C.txts.push({x,y,t,cor,g:!!g,b:C.t});if(C.txts.length>120)C.txts.shift();}
function imp(C,k){if(C.vis)C.imp.push({b:C.t,k});}   // impactos visuais (tremor de tela / congelamento): só o render lê
function fala(C,u,t){if(!C.vis)return;C.falas.push({u,t,b:C.t});}
function agendar(C,ms,f){C.ev.push({t:C.t+ms,f});C.ev.sort((a,b)=>a.t-b.t);}

/* ---- cálculo de atributos dinâmicos ---- */
const bv=(u,n,C)=>{const b=u.b[n];return b&&b.ate>u.C.t?b.v:0;};
function asEff(u){let a=u.as*(1+u.asB+bv(u,'as')+bv(u,'ace'));if(u.furia)a*=1+u.orcFuria;
  if(u.ie.hasteIni&&u.C.t<6000)a*=1+u.ie.hasteIni;            // Time Ring: arrancada nos primeiros 6 s
  if(!u.ie.semLento)a*=1-bv(u,'lento');return Math.max(.2,a);}
const armEff=u=>u.arm*u.armMul*(1-bv(u,'armR'));
const movEff=u=>Math.max(.4,(u.mov+bv(u,'ace'))*(u.ie.semLento?1:1-bv(u,'lento')));

/* ---- dano, cura, morte ---- */
/* fator de mitigação de um elemento no alvo (armadura para físico; resistência mágica e resistência elemental para o resto) */
function fatorEl(u,el,pen){if(el==='phys')return 100/(100+Math.max(-60,armEff(u)*(1-(pen||0))));return 100/(100+u.rm)*(1-Math.min(.6,u.res[el]||0));}
function darEscudo(C,u,v,dur){v=Math.round(v);if(v<=0)return;const es=u.b.escudo;if(es&&es.ate>C.t&&es.v>0){es.v+=v;es.ate=Math.max(es.ate,C.t+dur);}else u.b.escudo={ate:C.t+dur,v};}
function causar(C,src,u,bruto,el,o){o=o||{};if(!u.vivo)return 0;
  if(u.muroAte&&C.t<u.muroAte){fx(C,'blockhit',u.x,u.y);txt(C,u.x,u.y,'imune','#6fb8ff');return 0;}                     // Magic Wall (runa)
  if(o.basico&&u.esq>0&&C.r()<u.esq){fx(C,'dodge',u.x,u.y);txt(C,u.x,u.y,'esquivou','#7fe6ff');return 0;}
  let d=bruto*(C.sd?1+C.sd*.08:1);
  if(o.hab&&src&&src.ie.magCrit&&C.r()<src.ie.magCrit){d*=1.5;o.crit=true;fx(C,'critical_damage',u.x,u.y);}   // Wand of Starstorm: magia crítica
  let fe=fatorEl(u,el,src&&el==='phys'?src.ie.pen:0);                          // Crossbow: ignora parte da armadura
  if(src&&src.convs&&!o.sem){let f=0,ac=0;src.convs.forEach(c=>{if(c.el!==el){f+=c.f;ac+=c.f*fatorEl(u,c.el,0);}});   // encantamento elemental: parte do dano vira o elemento (e conta com a resistência dele)
    if(f>0){if(f>.6){ac*=.6/f;f=.6;}fe=(1-f)*fe+ac;}}
  d*=fe;
  d*=u.recMul;if(src)d*=1-bv(src,'fraco');
  d=Math.max(1,Math.round(d));
  const es=u.b.escudo;if(es&&es.ate>C.t&&es.v>0){const ab=Math.min(es.v,d);es.v-=ab;d-=ab;if(d<=0){txt(C,u.x,u.y,'absorveu','#9fe8a0');return 0;}}
  u.hp-=d;
  if(o.crit)txt(C,u.x,u.y,d+'!','#ffe14a',true);else txt(C,u.x,u.y,''+d,o.magia?(EL[el]||EL.phys).cor:'#f2efe0');
  if(src){C.dano[src.lado]+=d;if(src.st)src.st.d+=d;}u.st.r+=d;
  if(C.vis&&o.crit&&d>=450&&d>=u.hpM*.15)imp(C,'crit');
  if(u.manaM&&!o.rn)u.mana=Math.min(u.manaM,u.mana+Math.min(15,d/10));      // dano de runa não carrega a mana de quem apanha
  if(src&&src.roubo&&o.basico)curar(C,src,d*src.roubo,true);
  if(src&&src.rouboM&&o.hab)curar(C,src,d*src.rouboM,true);                      // Vampirismo também cura nas magias
  if(u.ie.manaHurt&&u.manaM)u.mana=Math.min(u.manaM,u.mana+u.ie.manaHurt);      // Knight Armor: mana ao apanhar
  if(src&&src!==u&&!o.refl&&src.vivo){                                           // reflexo: Golden Armor (golpes corpo a corpo) e Demon Shield (dano mágico)
    if(o.basico&&u.ie.refl&&cheb(src,u)<=1){fx(C,'blockhit',src.x,src.y);causar(C,u,src,d*u.ie.refl,'phys',{refl:true,sem:true});}
    else if(o.magia&&u.ie.reflMag&&!o.sem){fx(C,'blockhit',src.x,src.y);causar(C,u,src,d*u.ie.reflMag,el,{refl:true,sem:true,magia:true});}}
  if(u.uh&&u.hp>0&&u.hp<u.hpM*RN.uh.lim){u.uh=false;curar(C,u,u.hpM*RN.uh.cura);fx(C,'green_rings',u.x,u.y);fx(C,'hearts',u.x,u.y,100);txt(C,u.x,u.y-.5,'Ultimate Healing','#ff7a9a',true);}   // Ultimate Healing (runa): uma vez
  if(u.ie.escMeio&&!u.escMeioUsado&&u.hp>0&&u.hp<u.hpM*.5){u.escMeioUsado=true;darEscudo(C,u,u.hpM*u.ie.escMeio,6000);fx(C,'magic_blue',u.x,u.y);txt(C,u.x,u.y,'barreira','#9fe8a0');}   // Magic Plate Armor
  if(u.orcFuria&&!u.furia&&u.hp<u.hpM*.5&&u.hp>0){u.furia=true;fx(C,'magic_red',u.x,u.y);txt(C,u.x,u.y,'Fúria!','#ff6a4a');}
  if(u.hp<=0)morrer(C,u,src);
  return d;}
function curar(C,u,v,mudo,fonte){if(!u.vivo)return 0;v=Math.round(Math.min(v*(1-clamp(bv(u,'ferida'),0,.8))*C.curaMul[u.lado],u.hpM-u.hp));if(v<=0)return 0;u.hp+=v;C.cura[u.lado]+=v;(fonte||u).st.c+=v;if(!mudo)txt(C,u.x,u.y,'+'+v,EL.cura.cor);return v;}
function morrer(C,u,src){if(!u.vivo)return;
  if(u.ie.revive&&!u.revivido){u.revivido=true;u.hp=Math.max(1,Math.round(u.hpM*u.ie.revive));u.dots.length=0;u.stunAte=Math.max(u.stunAte,C.t+300);   // Amulet of Loss: volta uma vez
    fx(C,'holyarea',u.x,u.y);fx(C,'hearts',u.x,u.y,150);txt(C,u.x,u.y,'Ressuscitou!','#ffe680',true);return;}
  u.vivo=false;u.hp=0;if(C.occ[u.y*NC+u.x]===u.uid)C.occ[u.y*NC+u.x]=0;C.vivos[u.lado]--;if(C.vivos[u.lado]<=0)imp(C,'final');
  C.mortos.push({u,t:C.t,x:u.x,y:u.y});fx(C,'poff',u.x,u.y);
  if(C.sus&&C.sus[u.lado]===1&&!u.inv&&!u.pve){C.sus[u.lado]=2;fx(C,'firearea',u.x,u.y);      // Último Suspiro: só a primeira morte de cada lado
    C.un.filter(v=>v.vivo&&v.lado!==u.lado&&cheb(v,u)<=1).forEach(v=>{fx(C,'firearea',v.x,v.y);causar(C,u,v,u.hpM*BN.sus,'fire',{magia:true,sem:true});});}
  if(u.morteFogo){const inimigos=C.un.filter(v=>v.vivo&&v.lado!==u.lado&&cheb(v,u)<=1);fx(C,'firearea',u.x,u.y);
    inimigos.forEach(v=>{fx(C,'firearea',v.x,v.y);causar(C,u,v,u.atk*u.morteFogo,'fire',{magia:true});});}
  if(src&&src!==u&&src.vivo&&src.ie.killHeal){curar(C,src,src.hpM*src.ie.killHeal);fx(C,'green_rings',src.x,src.y);}}

/* ---- escolha de alvo / movimento ---- */
function alvoProvocado(C,u){const id=bv(u,'provocado'),v=id&&C.map[id];return v&&v.vivo&&v.lado!==u.lado?v:null;}
function escolherAlvo(C,u){const provocado=alvoProvocado(C,u);if(provocado)return provocado;let melhor=null;
  for(let passe=0;passe<2&&!melhor;passe++){let md=1e9,n=0;      // 1º passe ignora quem está furtivo (Stealth Ring); se só sobrar furtivo, ataca mesmo assim
    for(const v of C.un){if(!v.vivo||v.lado===u.lado||(passe===0&&v.furtivoAte>C.t))continue;const d=cheb(u,v)*100+dist2(u,v);
      if(d<md){md=d;melhor=v;n=1;}else if(d===md){n++;if(C.r()<1/n)melhor=v;}}}
  return melhor;}
function passoBFS(C,u,t){const ini=u.y*NC+u.x,prev=new Int16Array(NC*NR).fill(-1);prev[ini]=ini;const fila=[ini],ds=embaralhar(DIR8.slice(),C.r);
  for(let h=0;h<fila.length;h++){const c=fila[h],cx=c%NC,cy=(c/NC)|0;
    if(c!==ini&&Math.max(Math.abs(cx-t.x),Math.abs(cy-t.y))<=u.al){let p=c;while(prev[p]!==ini)p=prev[p];return p;}
    for(const [dx,dy] of ds){const nx=cx+dx,ny=cy+dy;if(!dentro(nx,ny))continue;const i=ny*NC+nx;if(prev[i]>=0||C.occ[i])continue;prev[i]=c;fila.push(i);}}
  return -1;}
function mover(C,u,t){const p=passoBFS(C,u,t);if(p<0)return false;const nx=p%NC,ny=(p/NC)|0;
  const dur=Math.max(100,Math.ceil(300/movEff(u)/100)*100);
  C.occ[u.y*NC+u.x]=0;C.occ[p]=u.uid;
  const cont=C.t-(u.t0+u.dur)<=100&&u.dur>0;if(!cont)u.andaDesde=C.t;
  u.fx=u.x;u.fy=u.y;u.x=nx;u.y=ny;u.t0=C.t;u.dur=dur;u.livreEm=C.t+dur;u.dir=dirPara({x:u.fx,y:u.fy},u);return true;}

/* ---- ataque básico ---- */
function atacar(C,u,t){u.prox=C.t+Math.round(1000/asEff(u));u.dir=dirPara(u,t);
  if(u.manaM)u.mana=Math.min(u.manaM,u.mana+10);
  const ie=u.ie,n=++u.nAt;
  let b=u.atk*(.92+C.r()*.16)*(1+u.dmgB+bv(u,'dmg'));let crit=false,pes=false;
  if(u.crit>0&&C.r()<u.crit){b*=1.5+(ie.critMul||0);crit=true;}
  if(ie.pesado&&n%3===0){b*=1+ie.pesado;pes=true;}                              // Giant Sword: o 3º golpe é pesado
  const ranged=u.al>1,a=u.d.atq||(ranged?AR:null);let atraso=130;
  if(ranged)atraso=tiro(C,a.t,u,t);
  u.lunge={b:C.t,dx:Math.sign(t.x-u.x),dy:Math.sign(t.y-u.y)};
  const hitN=a?a.hit:u.d.hit||'drawblood',el=u.el;
  agendar(C,atraso,()=>{if(!t.vivo)return;
    fx(C,hitN,t.x,t.y);if(crit)fx(C,'critical_damage',t.x,t.y);if(pes)fx(C,'explosionhit',t.x,t.y);
    const d=causar(C,u,t,b,el,{basico:true,crit,magia:el!=='phys'});
    if(d>0){if(u.queima&&t.manaM)t.mana=Math.max(0,t.mana-u.queima);
      if(u.estunaChance&&t.vivo&&C.r()<u.estunaChance)atordoar(C,t,1000);
      if(u.vivo)efeitosGolpe(C,u,t,b,el,n);}});}
/* efeitos marcantes dos itens que disparam quando o golpe acerta (tudo determinístico: só usa C.r e a ordem de C.un) */
function efeitosGolpe(C,u,t,b,el,n){const ie=u.ie;
  if(ie.manaHit&&u.manaM)u.mana=Math.min(u.manaM,u.mana+ie.manaHit);
  if(ie.stunPct&&t.vivo&&C.r()<ie.stunPct){atordoar(C,t,1000);fx(C,'energyhit',t.x,t.y);}                       // Thunder Hammer
  if(ie.burn&&t.vivo){const dd=u.atk*ie.burn,q=t.dots.find(x=>x.tag==='brasa'&&x.src===u);                        // Fire Sword
    if(q){q.n=3;q.d=Math.max(q.d,dd);}else t.dots.push({src:u,el:'fire',d:dd,n:3,prox:C.t+1000,ef:'hitbyfire',tag:'brasa'});}
  if(ie.cleave)C.un.forEach(v=>{if(v.vivo&&v.lado!==u.lado&&v!==t&&cheb(v,t)<=1){fx(C,'hitarea',v.x,v.y);causar(C,u,v,b*ie.cleave,el,{sem:true,magia:el!=='phys'});}});   // Stonecutter Axe
  if(ie.pierce){const x=t.x+Math.sign(t.x-u.x),y=t.y+Math.sign(t.y-u.y);                                           // Arbalest: o inimigo logo atrás
    if(dentro(x,y)){const vid=C.occ[y*NC+x],v=vid&&C.map[vid];if(v&&v.vivo&&v.lado!==u.lado){fx(C,'hitarea',x,y);causar(C,u,v,b*ie.pierce,el,{sem:true,magia:el!=='phys'});}}}
  if(ie.chuva&&n%4===0){const ra=u.d.atq||AR;                                                                      // Elethriel's Elemental Bow
    C.un.filter(v=>v.vivo&&v.lado!==u.lado&&v!==t).sort((p,q)=>dist2(p,t)-dist2(q,t)||p.uid-q.uid).slice(0,2).forEach(v=>{
      const dl=tiro(C,ra.t,u,v);agendar(C,dl,()=>{if(!v.vivo)return;fx(C,'hitarea',v.x,v.y);causar(C,u,v,b*ie.chuva,el,{sem:true,magia:el!=='phys'});});});}}
function atordoar(C,u,ms){if(!u.vivo)return;ms=Math.round(ms*(1-Math.min(.9,u.ie.stunRed||0)));const f=u.stunAte;u.stunAte=Math.max(u.stunAte,C.t+ms);fx(C,'stun',u.x,u.y-0.3);if(f<C.t)txt(C,u.x,u.y,'atordoado','#ffe680');}

/* =====================================================================================
   HABILIDADES: cada tipo toca o efeito real em cada tile atingido
   ===================================================================================== */
const habDano=(u,m)=>m*u.sk*(1+u.ap)*(u.d.pve?1:1);
const habCura=(u,m)=>habDano(u,m)*(1+(u.ie.curaPlus||0));                  // Dragon Necklace: curas maiores
const ECO_OK={alvo:1,onda:1,self:1,pos:1,cura:1,curaAmigo:1,curaArea:1};      // tipos de habilidade que o eco do Ferumbras' Hat repete
function escalaHab(h,k){const c=Object.assign({},h);if(c.m)c.m*=k;if(c.dot)c.dot=Object.assign({},c.dot,{m:c.dot.m*k});return c;}
function venenar(C,u,v,raw){v.dots.push({src:u,el:'earth',d:raw*u.ie.veneno/4,n:4,prox:C.t+1000,ef:'hitbypoison',tag:'veneno'});}   // Snakebite Rod
function auraInfernal(C,u){const dd=(u.atk*.5+u.sk*.15)*(1+u.ap)*u.ie.aura;                                                         // Demon Helmet
  C.un.forEach(v=>{if(v.vivo&&v.lado!==u.lado&&cheb(u,v)<=1){fx(C,'hitbyfire',v.x,v.y);causar(C,u,v,dd,'fire',{magia:true,sem:true});}});}
function auraCura(C,u){let a=null,mp=.98;                                                                                           // Sacred Tree Amulet
  C.un.forEach(v=>{if(!v.vivo||v.lado!==u.lado||cheb(u,v)>2)return;const p=v.hp/v.hpM;if(p<mp){mp=p;a=v;}});
  if(a){fx(C,'green_rings',a.x,a.y);curar(C,a,u.hpM*u.ie.auraCura,false,u);}}
function podeLancar(C,u,t){const h=u.hab;if(!h||bv(u,'silencio'))return false;const tp=h.t==='seq'?h.seq[0].t:h.t;
  if(tp==='cura')return u.hp<u.hpM*.9;
  if(tp==='curaAmigo'||tp==='curaArea')return C.un.some(v=>v.vivo&&v.lado===u.lado&&v.hp<v.hpM*.85&&(tp==='curaAmigo'||cheb(u,v)<=(h.raio||2)))||(h.t==='seq'&&t&&cheb(u,t)<=u.al);
  if(tp==='invocar'||tp==='buff')return !!t&&cheb(u,t)<=Math.max(u.al,3)+ (tp==='buff'?1:3);
  return !!t&&cheb(u,t)<=u.al;}
function alvoHabilidade(C,u,t){if(!u.hab.finaliza||alvoProvocado(C,u))return t;
  return C.un.filter(v=>v.vivo&&v.lado!==u.lado&&cheb(u,v)<=u.al&&v.furtivoAte<=C.t).sort((a,b)=>a.hp/a.hpM-b.hp/b.hpM||a.uid-b.uid)[0]||t;}
function lancar(C,u,h){const t=u.alvo;u.mana=u.ie.manaRet?Math.round(u.manaM*Math.min(.9,u.ie.manaRet)):0;if(u.mana>0)txt(C,u.x,u.y,'+mana','#6fa8ff');if(C.vis&&!u.pve&&!u.inv&&u.d.c===5)imp(C,'hab5');u.livreEm=Math.max(u.livreEm,C.t+500);u.prox=Math.max(u.prox,C.t+700);
  if(t)u.dir=dirPara(u,t);
  fala(C,u,h.p);
  const seq=h.t==='seq'?h.seq:[h];
  seq.forEach(s=>{const at=s.atraso||0;if(at>0)agendar(C,at,()=>{if(u.vivo)acaoHab(C,u,s,u.alvo&&u.alvo.vivo?u.alvo:t);});else acaoHab(C,u,s,t);});
  if(u.ie.escLanca){darEscudo(C,u,u.hpM*u.ie.escLanca,4000);fx(C,'magic_blue',u.x,u.y);}              // Mastermind Shield
  if(u.ie.eco){const k=u.ie.eco;agendar(C,850,()=>{if(!u.vivo)return;const al=u.alvo&&u.alvo.vivo?u.alvo:t;   // Ferumbras' Hat: a magia sai de novo
    fx(C,'purpleenergy',u.x,u.y);txt(C,u.x,u.y,'eco','#c9a0ff');seq.forEach(s=>{if(ECO_OK[s.t])acaoHab(C,u,escalaHab(s,k),al);});});}}
function areaTiles(h,cx,cy,dir){if(h.area)return tilesArea(h.area,cx,cy,dir);const r=h.raio||1,o=[];for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)o.push([cx+x,cy+y]);return o;}
function danoArea(C,u,h,tiles,el,mult,efNome,tempoEscalonado){let n=0;
  tiles.forEach(([x,y],i)=>{if(!dentro(x,y))return;if(efNome)fx(C,efNome,x,y,tempoEscalonado?(i%5)*40:0);
    const vid=C.occ[y*NC+x];if(!vid)return;const v=C.map[vid];if(!v||!v.vivo||v.lado===u.lado)return;
    const raw=habDano(u,mult);causar(C,u,v,raw,el,{magia:true,hab:true});n++;if(u.ie.veneno&&v.vivo)venenar(C,u,v,raw);
    if(h.stun)atordoar(C,v,h.stun);if(h.deb)aplicarDeb(C,v,h.deb);if(h.dot)aplicarDot(C,u,v,h.dot);
    if(h.drena)curar(C,u,habDano(u,mult)*h.drena*.6);});
  return n;}
function aplicarDeb(C,v,deb){if(!v.vivo)return;const dur=deb.dur||4000;Object.keys(deb).forEach(k=>{if(k==='dur')return;
  const antes=bv(v,k),b=v.b[k];v.b[k]={ate:Math.max(C.t+dur,b&&b.ate>C.t?b.ate:0),v:Math.max(antes,deb[k])};
  if(k==='ferida'&&!antes)txt(C,v.x,v.y,'Ferida','#ed7971');if(k==='silencio'&&!antes)txt(C,v.x,v.y,'Silêncio','#cba5ff');});fx(C,'sound_purple',v.x,v.y);}
function provocar(C,u,ms,raio){C.un.forEach(v=>{if(!v.vivo||v.lado===u.lado||cheb(u,v)>raio)return;v.b.provocado={ate:C.t+ms,v:u.uid};v.alvo=u;txt(C,v.x,v.y,'Provocado','#f4c978');});fx(C,'yellow_rings',u.x,u.y);}
function aplicarDot(C,u,v,dot){v.dots.push({src:u,el:dot.el,d:habDano(u,dot.m)/dot.dur,n:dot.dur,prox:C.t+1000,ef:dot.ef});}
/* onda: avalia as 4 direções e escolhe a que atinge mais inimigos vivos (alvo atual vale ×1,5); empate: direção do alvo (dirPara), depois ordem fixa 0-3; sem RNG */
function melhorDirOnda(C,u,h,t,pref){let melhor=pref,mp=-1;
  [pref,0,1,2,3].forEach(d=>{let p=0;tilesArea(h.area,u.x,u.y,d).forEach(([x,y])=>{if(!dentro(x,y))return;const vid=C.occ[y*NC+x];if(!vid)return;const v=C.map[vid];if(v&&v.vivo&&v.lado!==u.lado)p+=v===t?1.5:1;});
    if(p>mp+1e-9){mp=p;melhor=d;}});
  return melhor;}
function acaoHab(C,u,h,t){const el=h.el||'phys',dir=t?dirPara(u,t):(u.lado===0?0:2);
  switch(h.t){
    case 'alvo':{if(!t||!t.vivo)return;const d=h.tiro?tiro(C,h.tiro,u,t):80,dano=habDano(u,h.m);
      agendar(C,d,()=>{if(!t.vivo)return;const fatal=h.finaliza&&t.hp/t.hpM<=h.finaliza.limiar,raw=dano*(fatal?h.finaliza.mult:1);fx(C,h.ef,t.x,t.y);if(fatal)fx(C,'fatal',t.x,t.y);const r=causar(C,u,t,raw,el,{magia:true,hab:true});if(u.ie.veneno&&t.vivo)venenar(C,u,t,raw);if(h.stun)atordoar(C,t,h.stun);if(h.deb)aplicarDeb(C,t,h.deb);if(h.dot&&t.vivo)aplicarDot(C,u,t,h.dot);if(h.drena&&r)curar(C,u,r*h.drena);});break;}
    case 'onda':{const d2=melhorDirOnda(C,u,h,t,dir);u.dir=d2;if(t&&h.tiro)tiro(C,h.tiro,u,t);danoArea(C,u,h,tilesArea(h.area,u.x,u.y,d2),el,h.m,h.ef,true);break;}
    case 'self':{const tl=areaTiles(h,u.x,u.y,dir).filter(([x,y])=>!(x===u.x&&y===u.y));danoArea(C,u,h,tl,el,h.m,h.ef,false);if(h.provoca)provocar(C,u,h.provoca,h.raio||1);break;}
    case 'pos':{if(!t)return;const d=h.tiro?tiro(C,h.tiro,u,t):60,cx=t.x,cy=t.y;
      agendar(C,d,()=>{danoArea(C,u,h,areaTiles(h,cx,cy,0),el,h.m,h.ef,false);});break;}
    case 'cura':{fx(C,h.ef||'magic_blue',u.x,u.y);curar(C,u,habCura(u,h.m));break;}
    case 'curaAmigo':{let a=null,mp=2;C.un.forEach(v=>{if(!v.vivo||v.lado!==u.lado)return;const p=v.hp/v.hpM;if(p<mp){mp=p;a=v;}});if(!a)return;
      fx(C,h.ef||'magic_blue',a.x,a.y);curar(C,a,habCura(u,h.m),false,u);if(a!==u)fx(C,'magic_green',u.x,u.y);break;}
    case 'curaArea':{const r=h.raio||2;fx(C,'magic_green',u.x,u.y);C.un.forEach(v=>{if(!v.vivo||v.lado!==u.lado||cheb(u,v)>r)return;fx(C,h.ef||'magic_blue',v.x,v.y);curar(C,v,habCura(u,h.m),false,u);});break;}
    case 'invocar':{const n=h.n||1,molde=U[h.id],mul=(C.invMul&&C.invMul[u.lado])||1;let k=0;
      const livres=[];for(const [dx,dy] of embaralhar(DIR8.slice(),C.r)){const x=u.x+dx,y=u.y+dy;if(dentro(x,y)&&!C.occ[y*NC+x])livres.push([x,y]);}
      if(livres.length<n){for(let r=2;r<=3&&livres.length<n;r++)for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){const xx=u.x+x,yy=u.y+y;if(Math.max(Math.abs(x),Math.abs(y))===r&&dentro(xx,yy)&&!C.occ[yy*NC+xx])livres.push([xx,yy]);}}
      for(let i=0;i<n&&i<livres.length;i++){const [x,y]=livres[i];const nu=novoUnit(C,{d:Object.assign({},molde,{hab:null}),e:1,x,y,inv:true,hpMul:.55*ESTR[u.e||1]*mul},u.lado);nu.hp=nu.hpM;nu.prox=C.t+500;nu.livreEm=C.t+400;nu.dir=u.dir;nu.manaM=0;
        nu.arm=Math.round(nu.arm*.7);fx(C,h.ef||'magic_red',x,y);k++;}
      if(k)txt(C,u.x,u.y,'invocou!','#d9b45a');break;}
    case 'buff':{const alvos=h.raio?C.un.filter(v=>v.vivo&&v.lado===u.lado&&cheb(u,v)<=h.raio):[u];
      alvos.forEach(v=>{fx(C,h.ef||'magic_green',v.x,v.y);
        if(h.buff){Object.keys(h.buff).forEach(k=>{if(k==='dur')return;v.b[k]={ate:C.t+(h.buff.dur||4000),v:h.buff[k]};});}
        if(h.escudo){v.b.escudo={ate:C.t+(h.dur||5000),v:Math.round(v.hpM*h.escudo)};txt(C,v.x,v.y,'escudo','#9fe8a0');}});break;}
  }}

/* =====================================================================================
   O passo de 100 ms
   ===================================================================================== */
function passo(C){if(C.fim)return;C.t+=100;C.tk++;
  // eventos agendados (mísseis em voo, magias atrasadas)
  while(C.ev.length&&C.ev[0].t<=C.t){const e=C.ev.shift();e.f();}
  // morte súbita: depois do tempo máximo todo mundo sofre dano verdadeiro crescente
  if(C.t>C.tempoMax){C.sd=(C.t-C.tempoMax)/1000;if(C.t%500===0)C.un.forEach(u=>{if(!u.vivo)return;const d=Math.round(u.hpM*(.08+.04*C.sd)/2);u.hp-=d;txt(C,u.x,u.y,''+d,'#ff4040');if(u.hp<=0)morrer(C,u,null);});}
  // efeitos por segundo / por 2 segundos
  if(C.t%1000===0)C.un.forEach(u=>{if(!u.vivo)return;
    if(u.regen)curar(C,u,u.hpM*u.regen,false);if(u.mreg&&u.manaM)u.mana=Math.min(u.manaM,u.mana+u.mreg);if(u.ie.aura)auraInfernal(C,u);
    for(let i=u.dots.length-1;i>=0;i--){const dt=u.dots[i];if(!dt)continue;if(dt.prox<=C.t){fx(C,dt.ef||'hitbypoison',u.x,u.y);causar(C,dt.src,u,dt.d,dt.el,{magia:true,sem:true});if(!u.vivo)break;dt.prox+=1000;if(--dt.n<=0)u.dots.splice(i,1);}}});
  if(C.t%2000===0)C.un.forEach(u=>{if(u.vivo&&u.ie.auraCura)auraCura(C,u);});
  if(C.curaTime&&C.t%2000===0)for(let l=0;l<2;l++)if(C.curaTime[l])C.un.forEach(u=>{if(u.vivo&&u.lado===l){const v=curar(C,u,u.hpM*C.curaTime[l]);if(v)fx(C,'green_rings',u.x,u.y);}});
  // reiteração do efeito de atordoamento
  if(C.vis&&C.t%500===0)C.un.forEach(u=>{if(u.vivo&&u.stunAte>C.t)fx(C,'stun',u.x,u.y-.3);});
  const ordem=embaralhar(C.un.filter(u=>u.vivo),C.r);
  for(const u of ordem){if(!u.vivo)continue;agir(C,u);if(C.vivos[0]<=0||C.vivos[1]<=0)break;}
  if(C.vivos[0]<=0||C.vivos[1]<=0)finalizar(C);
  else if(C.t>=C.tempoMax+60000){finalizar(C);}   // trava de segurança: desempata pela vida restante
}
function agir(C,u){if(C.t<u.stunAte||C.t<u.livreEm)return;
  const provocado=alvoProvocado(C,u);let t=provocado||u.alvo;if(provocado)u.alvo=provocado;
  if(!t||!t.vivo)t=u.alvo=escolherAlvo(C,u);
  else if(!provocado&&cheb(u,t)>u.al){const p=escolherAlvo(C,u);if(p&&cheb(u,p)<cheb(u,t))t=u.alvo=p;}
  if(!t)return;
  u.dir=dirPara(u,t);
  if(u.hab&&u.manaM&&u.mana>=u.manaM&&podeLancar(C,u,t)){u.alvo=alvoHabilidade(C,u,t);lancar(C,u,u.hab);return;}
  if(cheb(u,t)<=u.al){if(C.t>=u.prox)atacar(C,u,t);}
  else mover(C,u,t);}
function finalizar(C){if(C.fim)return;C.fim=true;
  const a=C.vivos[0],b=C.vivos[1];
  if(a>0&&b<=0)C.venc=0;else if(b>0&&a<=0)C.venc=1;
  else if(a>0&&b>0){const h=[0,0];C.un.forEach(u=>{if(u.vivo)h[u.lado]+=u.hp;});C.venc=h[0]>h[1]?0:h[1]>h[0]?1:-1;C.tempoEsgotado=true;}else C.venc=-1;
  C.estrelas=[0,0];C.un.forEach(u=>{if(u.vivo&&!u.inv&&!u.pve)C.estrelas[u.lado]+=u.e||1;else if(u.vivo&&u.pve)C.estrelas[u.lado]+=1;});}
function simular(C){let n=0;while(!C.fim&&n++<2000)passo(C);if(!C.fim)finalizar(C);return C;}

function todos(p){const o=[];p.banco.forEach((inst,i)=>{if(inst)o.push({onde:'banco',i,inst});});

function autoCombinarLista(l){l=l.slice();let mudou=true;
  while(mudou){mudou=false;const ci=[];l.forEach((c,i)=>{if(ehComp(c))ci.push(i);});
    for(let a=0;a<ci.length&&!mudou;a++)for(let b=a+1;b<ci.length&&!mudou;b++){const r=codCombinar(l[ci[a]],l[ci[b]]);if(r){l[ci[a]]=r;l.splice(ci[b],1);mudou=true;}}}

function fundir(G,p){let mudou=true,n=0,fundiu=[];
  while(mudou&&n++<20){mudou=false;const g={};
    todos(p).forEach(L=>{const k=L.inst.id+'|'+L.inst.e;(g[k]=g[k]||[]).push(L);});
    for(const k in g){const l=g[k];if(l.length>=3&&l[0].inst.e<3){
      l.sort((a,b)=>(a.onde==='tab'?0:1)-(b.onde==='tab'?0:1));const tres=l.slice(0,3),alvo=tres[0];
      const it=autoCombinarLista([].concat(...tres.map(L=>L.inst.itens)));tres.slice(1).forEach(L=>remover(p,L));
      alvo.inst.e++;alvo.inst.itens=it.slice(0,3);it.slice(3).forEach(id=>{if(p.itens.length<MAX_ITENS)p.itens.push(id);});

  if(fundiu.length)p.fusoes=(p.fusoes||[]).concat(fundiu);

function sortearCarta(G,p){const odds=ODDS[p.nivel];

function devolverLoja(G,p,tudo){p.loja.forEach((id,i)=>{if(!id||(!tudo&&i===p.cong))return;G.pool[id]++;p.loja[i]=null;});if(tudo){p.cong=-1;p.rl=null;}}   // a runa da loja (p.rl) não vem do pool   // a carta congelada (Caçada) não volta ao pool
/* runa na loja: a partir do estágio 2, 25% de chance de UM slot (nunca o congelado) virar uma runa; sorteio semeado do jogo */
function sortearRunaLoja(G,p){p.rl=null;if(G.opt.semRunas||G.info.est<RN.estMin||rnd()>=RN.chance)return;
  const livres=[0,1,2,3,4].filter(i=>!(i===p.cong&&p.loja[i]));if(!livres.length)return;
  p.rl={i:pick(livres),k:1+Math.floor(rnd()*(RUNA.length-1))};}
function rolarLoja(G,p){devolverLoja(G,p);sortearRunaLoja(G,p);for(let i=0;i<5;i++)if(!(i===p.cong&&p.loja[i])&&!(p.rl&&p.rl.i===i))p.loja[i]=sortearCarta(G,p);}
/* runas: comprar (ouro + vaga na mochila: bolsa + armadas <= 3), armar (preparação; máx. 2 por luta) e desarmar; as armadas são gastas na próxima luta (consumirRunas) */
function comprarRuna(p,i){const r=p.rl;if(!r||r.i!==i||!RUNA[r.k])return 'x';const R=RUNA[r.k];
  if(p.ouro<R.custo)return 'Ouro insuficiente';if(runasTotal(p)>=RN.mochila)return 'Mochila de runas cheia';
  p.ouro-=R.custo;p.mr.push(r.k);p.rl=null;return null;}
function armarRuna(G,p,c){if(G.fase!=='prep')return 'Só na preparação';if(!ehInt(c.i,0,RN.mochila-1)||p.mr[c.i]===undefined)return 'x';const k=p.mr[c.i],R=RUNA[k];
  let u=0;if(R.alvo){const L=unidadeDe(p,locOk(c.un,p));if(!L)return 'x';u=L.inst.uid;}
  if(p.ra.length>=RN.armMax)return `No máximo ${RN.armMax} runas armadas por luta`;
  if(p.ra.some(a=>a.k===k))return 'Já há uma runa igual armada';
  p.mr.splice(c.i,1);p.ra.push({k,u});return null;}
function desarmarRuna(G,p,c){if(G.fase!=='prep')return 'Só na preparação';if(!ehInt(c.i,0,RN.armMax-1)||!p.ra[c.i])return 'x';p.mr.push(p.ra[c.i].k);p.ra.splice(c.i,1);return null;}
/* a runa de unidade só vale se a unidade estiver NO TABULEIRO na hora da luta; senão (vendida, fundida ou no banco) volta para a mochila */
const runaValida=(p,a)=>!RUNA[a.k].alvo||todos(p).some(L=>L.onde==='tab'&&L.inst.uid===a.u);
function consumirRunas(p){p.ra.forEach(a=>{if(!runaValida(p,a))p.mr.push(a.k);});p.ra=[];}
const precoLoja=(p,i)=>{const id=p.loja[i];if(!id)return 0;return Math.max(1,U[id].c-(i===p.cong?PODN.desc:0));};
function podeComprar(p,id,i){const d=U[id];if(p.ouro<(i===undefined?d.c:precoLoja(p,i)))return 'ouro';if(vagaBanco(p)<0&&copias(p,id,1)<2)return 'banco';return null;}
function comprar(G,p,i){const id=p.loja[i];if(!id)return false;if(podeComprar(p,id,i))return false;
  p.ouro-=precoLoja(p,i);p.loja[i]=null;if(p.cong===i)p.cong=-1;const v=vagaBanco(p),inst=novoInst(G,id);
  if(v>=0)p.banco[v]=inst;else p.banco.push(inst);      // banco cheio: só passa aqui se a compra completa uma fusão
  fundir(G,p);while(p.banco.length>MAX_BANCO&&p.banco[p.banco.length-1]===null)p.banco.pop();return true;}
function venderInst(G,p,L){const inst=L.inst;p.ouro+=valorVenda(inst);G.pool[inst.id]+=Math.pow(3,inst.e-1);devolverItens(p,inst);remover(p,L);}
function comprarXP(p){if(p.nivel>=9||p.ouro<4)return false;p.ouro-=4;ganharXP(p,4);return true;}
function rolar(G,p){if(p.ouro<2)return false;p.ouro-=2;rolarLoja(G,p);p.rolados++;return true;}
/* mover unidade: destino {onde:'banco',i} ou {onde:'tab',x,y}; troca se ocupado; respeita o limite do nível */
function moverUn(p,de,para,emCombate){
  if(para.onde==='tab'&&(para.y<0||para.y>3||para.x<0||para.x>7))return false;
  if((de.onde==='tab'||para.onde==='tab')&&emCombate)return false;
  const dest=para.onde==='banco'?p.banco[para.i]:p.tab[para.y][para.x],orig=de.onde==='banco'?p.banco[de.i]:p.tab[de.y][de.x];
  if(!orig)return false;
  if(de.onde==='banco'&&para.onde==='tab'&&!dest&&contarTab(p)>=limUn(p))return false;
  if(de.onde===para.onde&&((de.onde==='banco'&&de.i===para.i)||(de.onde==='tab'&&de.x===para.x&&de.y===para.y)))return true;
  if(de.onde==='banco'){p.banco[de.i]=dest||null;}else p.tab[de.y][de.x]=dest||null;
  if(para.onde==='banco'){p.banco[para.i]=orig;}else p.tab[para.y][para.x]=orig;
  return true;}
/* combinar (2 componentes), forjar (2 itens completos iguais) e encantar (pergaminho + item completo). Operandos: a = índice no inventário (ca = o código esperado);
   o outro lado é b (outro item do inventário, cb) OU un + slot (um item que a unidade já carrega). Devolve null se deu certo, texto de aviso se falhou, 'x' se for inválido. */
function opItem(p,c){const t=c.t;
  if(!ehInt(c.a,0,MAX_ITENS-1)||p.itens[c.a]===undefined||p.itens[c.a]!==c.ca)return 'x';
  const ca=p.itens[c.a];let cb,inst=null,slot=-1;
  if(c.un===undefined){if(t==='encantar'||!ehInt(c.b,0,MAX_ITENS-1)||c.b===c.a||p.itens[c.b]===undefined||p.itens[c.b]!==c.cb)return 'x';cb=p.itens[c.b];}
  else{const L=unidadeDe(p,locOk(c.un,p));if(!L||!ehInt(c.slot,0,2)||L.inst.itens[c.slot]===undefined)return 'x';inst=L.inst;slot=c.slot;cb=inst.itens[slot];}
  let r=0;
  if(t==='combinar'){r=codCombinar(ca,cb);if(!r)return 'Esses itens não combinam';}
  else if(t==='forjar'){r=codForjar(ca,cb);if(!r)return itFj(ca)>=3||itFj(cb)>=3?'Esse item já está forjado ao máximo (+3)':'Só dá para forjar dois itens completos iguais';}
  else{if(!inst)return 'x';r=codEncantar(cb,ca);if(!r)return !ehCompleto(cb)?'O encantamento só vale em itens completos':itEn(cb)?'Esse item já tem um encantamento':'x';}
  if(inst){inst.itens[slot]=r;p.itens.splice(c.a,1);}
  else{const lo=Math.min(c.a,c.b),hi=Math.max(c.a,c.b);p.itens[lo]=r;p.itens.splice(hi,1);}
  return null;}
function equipar(p,iItem,inst){if(inst.itens.length>=3||!p.itens[iItem])return false;inst.itens.push(p.itens[iItem]);p.itens.splice(iItem,1);return true;}

/* =====================================================================================
   COMANDOS: toda ação de um humano passa por execCmd(G,p,c). A interface local chama; o anfitrião também chama
   para os comandos que chegam pela rede. Devolve null se deu certo, texto de aviso se falhou, 'x' se for inválido.
   ===================================================================================== */
const ehInt=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
function locOk(l,p){if(!l||typeof l!=='object')return null;
  if(l.onde==='banco'&&ehInt(l.i,0,MAX_BANCO))return {onde:'banco',i:l.i};
  if(l.onde==='tab'&&ehInt(l.x,0,NC-1)&&ehInt(l.y,0,3))return {onde:'tab',x:l.x,y:l.y};return null;}
function unidadeDe(p,l){if(!l)return null;if(l.onde==='banco'){const inst=p.banco[l.i];return inst?{onde:'banco',i:l.i,inst}:null;}
  const inst=p.tab[l.y]&&p.tab[l.y][l.x];return inst?{onde:'tab',x:l.x,y:l.y,inst}:null;}
/* ativo da vocação: valida (fase, uma vez por rodada, ouro, alvo) e aplica; o efeito em combate viaja pela equipe (espDeJog) */
function usarPoder(G,p,c){const P=PODER[p.voc];if(!P||PODERES_OFF)return 'Poderes desligados';
  if(G.fase!=='prep')return 'Só na preparação';if(p.podU)return 'Poder já usado nesta rodada';if(p.ouro<P.custo)return 'Ouro insuficiente';
  if(p.voc==='knight'){const L=unidadeDe(p,locOk(c.alvo,p));if(!L)return 'x';p.podEsc=L.inst.uid;}
  else if(p.voc==='paladin'){if(!ehInt(c.alvo,0,4))return 'x';if(p.rl&&p.rl.i===c.alvo)return 'Runas não podem ser congeladas';if(!p.loja[c.alvo])return 'x';p.cong=c.alvo;}
  else if(p.voc==='sorcerer')p.podRuna=true;
  else{if(p.nivel>=9)return 'Nível máximo';ganharXP(p,PODN.xp);}
  p.ouro-=P.custo;p.podU=true;return null;}
function execCmd(G,p,c){if(!p||!p.vivo)return 'Você foi eliminado';if(!c||typeof c!=='object')return 'x';const prep=G.fase==='prep';
  switch(c.t){
    case 'comprar':{if(!ehInt(c.i,0,4))return 'x';const id=p.loja[c.i];if(!id)return 'x';const r=podeComprar(p,id,c.i);if(r)return r==='ouro'?'Ouro insuficiente':'Banco cheio';comprar(G,p,c.i);return null;}
    case 'rolar':return rolar(G,p)?null:'Ouro insuficiente';
    case 'xp':if(p.nivel>=9)return 'Nível máximo';return comprarXP(p)?null:'Ouro insuficiente';
    case 'travar':p.travada=!p.travada;return null;
    case 'poder':return usarPoder(G,p,c);
    case 'comprarRuna':{if(!ehInt(c.i,0,4))return 'x';return comprarRuna(p,c.i);}
    case 'armar':return armarRuna(G,p,c);
    case 'desarmar':return desarmarRuna(G,p,c);
    case 'bencao':{if(!prep)return 'Só na preparação';if(!p.ob)return 'Você não tem bênção para escolher';if(!ehInt(c.i,0,2))return 'x';return escolherBn(G,p,c.i);}
    case 'bencaoRr':{if(!prep)return 'Só na preparação';if(!p.ob)return 'Você não tem bênção para escolher';if(p.ob.rr<=0)return 'Rerrolagem já usada';rerolarBn(G,p);return null;}
    case 'mover':{const de=locOk(c.de,p),pa=locOk(c.para,p);if(!de||!pa)return 'x';
      if(de.onde==='banco'&&de.i>=p.banco.length)return 'x';
      if(!moverUn(p,de,pa,!prep))return pa.onde==='tab'?(!prep?'Só é possível reposicionar na preparação':'Limite de unidades do nível atingido'):'x';return null;}
    case 'vender':{const L=unidadeDe(p,locOk(c.de,p));if(!L)return 'x';if(L.onde==='tab'&&!prep)return 'Não é possível vender em combate';venderInst(G,p,L);return null;}
    case 'equipar':{const L=unidadeDe(p,locOk(c.un,p));if(!L||!ehInt(c.item,0,MAX_ITENS-1)||!ITEM[itId(c.id)]||p.itens[c.item]!==c.id)return 'x';
      if(ehPerg(c.id))return 'O pergaminho se usa sobre um item completo da unidade';
      if(L.inst.itens.length>=3)return 'A unidade já carrega 3 itens';equipar(p,c.item,L.inst);return null;}
    case 'combinar':case 'forjar':case 'encantar':return opItem(p,c);
    case 'pronto':{if(!prep)return 'x';if(G.info.tipo==='car'&&!carPronto(G))return 'x';
      if(contarTab(p)===0&&todos(p).length>0&&G.info.tipo!=='car')return 'Arraste uma unidade do banco para o tabuleiro';p.pronto=true;return null;}
    case 'carrossel':{if(!G.car||!ehInt(c.i,0,G.car.itens.length-1))return 'x';return carEscolher(G,c.i,p)?null:'Não é a sua vez';}
  }return 'x';}

/* ---------- bênçãos: oferta, rerrolagem, escolha e efeitos imediatos (tudo no anfitrião, com o sorteio semeado do jogo) ---------- */
const ITENS_COMPLETOS=ITENS.filter(i=>i.rec).map(i=>i.id);
function sortearOpBn(p,t,evitar){const ids=BEN_IDS[t].filter(id=>!temBn(p,id));let c=ids.filter(id=>!evitar||!evitar.includes(id));if(c.length<3)c=ids;return embaralhar(c.slice()).slice(0,3);}
function ofertarBn(G,p){const t=BEN_ROD[G.info.nome];if(t===undefined||p.ob||!p.vivo)return;p.ob={t,op:sortearOpBn(p,t),rr:1};}
function rerolarBn(G,p){const o=p.ob;o.rr--;o.op=sortearOpBn(p,o.t,o.op);}
const darItemBn=(p,cod,ouro)=>{if(p.itens.length<MAX_ITENS)p.itens.push(cod);else p.ouro+=ouro;};   // inventário cheio: vira ouro
function darUnidadeBn(G,p,custo){const ids=LISTA_U.filter(id=>U[id].c===custo&&G.pool[id]>0);let tot=0;ids.forEach(id=>tot+=G.pool[id]);
  if(!ids.length){p.ouro+=custo;return null;}
  let x=rnd()*tot,id=ids[ids.length-1];for(const i of ids){x-=G.pool[i];if(x<0){id=i;break;}}
  const v=vagaBanco(p);if(v<0&&copias(p,id,1)<2){p.ouro+=custo;return null;}      // banco cheio (e sem fusão possível): vira ouro = custo
  G.pool[id]--;const inst=novoInst(G,id);if(v>=0)p.banco[v]=inst;else p.banco.push(inst);      // como na compra: sem vaga só passa se completar uma fusão
  fundir(G,p);while(p.banco.length>MAX_BANCO&&p.banco[p.banco.length-1]===null)p.banco.pop();return id;}
function aplicarBn(G,p,id){switch(id){
  case 1:p.ouro+=BN.ouro;break;
  case 2:for(let i=0;i<2;i++)darItemBn(p,pick(COMPS),2);break;
  case 3:ganharXP(p,BN.xp);break;
  case 4:darUnidadeBn(G,p,2);p.ouro+=BN.recr;break;
  case 9:darItemBn(p,pick(ITENS_COMPLETOS),4);break;
  case 12:darUnidadeBn(G,p,4);break;
  case 13:darUnidadeBn(G,p,5);darItemBn(p,pick(COMPS),2);break;
  case 16:p.ouro+=BN.tes;break;
  case 17:for(let i=0;i<2;i++)darItemBn(p,pick(ITENS_COMPLETOS),4);break;}}   // 5, 6, 7, 8, 10, 11, 14, 15, 18: persistentes ou de combate (ver temBn / criarCombate)
function escolherBn(G,p,i){const o=p.ob;if(!o)return 'Você não tem bênção para escolher';if(!ehInt(i,0,2)||o.op[i]===undefined)return 'x';
  const id=o.op[i];p.ob=null;(p.bn||(p.bn=[])).push(id);aplicarBn(G,p,id);return null;}
/* bot: nota = aleatório + leve preferência por unidades (sem depender da força do bot, para não enviesar as estatísticas); às vezes gasta a rerrolagem quando nada empolga */
function escolherBot(G,p){const o=p.ob;if(!o)return;
  const nota=id=>{const c=BEN[id].c;return 1+(c===3?.25:0)+rnd()*.8;};
  let ns=o.op.map(nota);if(o.rr>0&&Math.max(...ns)<1.45&&rnd()<.4){rerolarBn(G,p);ns=o.op.map(nota);}
  escolherBn(G,p,ns.indexOf(Math.max(...ns)));}

/* ---------- itens: sorteio por estágio ---------- */
/* drop: um componente sorteado; a partir do estágio 2 também podem cair pergaminhos de encantamento */
function sortearItem(est){if(est>=2&&rnd()<PERG_CHANCE)return pick(ENCANTOS).pid;return pick(COMPS);}
const tierCar=id=>ITEM[id]&&ITEM[id].perg?2:1;

/* =====================================================================================
   Equipes para o combate (coordenadas da arena)
   ===================================================================================== */
function espDeJog(p,lado,est){const ar=est===undefined?[]:(p.ra||[]).filter(a=>runaValida(p,a));   // runas armadas só entram na equipe de uma luta de verdade (est = estágio); pré-visualizações ficam sem
  const un=[];p.tab.forEach((l,y)=>l.forEach((inst,x)=>{if(!inst)return;
  const s={d:U[inst.id],e:inst.e,x:lado===0?x:7-x,y:lado===0?TAB_Y+y:3-y,itens:inst.itens.slice(),inst,esc:p.podEsc&&inst.uid===p.podEsc},ru=ar.filter(a=>a.u&&a.u===inst.uid).map(a=>a.k);if(ru.length)s.ru=ru;un.push(s);}));
  return {un,voc:PODERES_OFF?null:p.voc,sd:!PODERES_OFF&&p.voc==='sorcerer'&&p.podRuna,bn:(p.bn||[]).slice(),ru:ar.filter(a=>!a.u).map(a=>a.k),re:est||0};}
function monDef(id,f){const m=MON[id],sp=SPR.criaturas[id];
  return {id:'m_'+id,mon:id,mf:f,nome:m.n,spr:id,voc:null,c:0,o:'pve',k:'pve',pve:true,hp:Math.round(m.hp*f*HPG),atk:Math.round(m.atk*f),arm:m.arm,al:m.al,as:m.as,sk:Math.round((m.sk||0)*f),
    hit:m.hit||'drawblood',atq:m.atq||null,el:m.el||'phys',hab:m.hab||null,mana:m.hab?70:0,m0:m.hab?25:0,cad:sp&&sp.cad};}
function espPvE(est,n){const w=ondaPvE(est,n),lista=[];w.m.forEach(([id,q])=>{for(let i=0;i<q;i++)lista.push(id);});
  const cols=[3,4,2,5,1,6,0,7],un=[],frente=lista.filter(id=>MON[id].al<=1),fundo=lista.filter(id=>MON[id].al>1);
  const pos=[];for(let y=0;y<4;y++)cols.forEach(x=>pos.push([x,y]));
  let k=0;frente.forEach(id=>{const [x,y]=pos[k++];un.push({d:monDef(id,w.f),e:1,x:7-x,y:3-y});});
  k=Math.max(k,8);fundo.forEach(id=>{const [x,y]=pos[k++];un.push({d:monDef(id,w.f),e:1,x:7-x,y:3-y});});
  return {un};}

/* =====================================================================================
   IA dos bots
   ===================================================================================== */
const potUn=inst=>(1+.5*(U[inst.id].c-1))*ESTR[inst.e]+inst.itens.length*.4;
function valorTr(ids){const c=contarTracos(ids);let v=0;for(const t in c){const n=nivelTraco(t,c[t]);if(n>=0)v+=(n+1)*1.6+(n>=1?.5:0);else v+=c[t]*.25;}return v;}
function ptsCompra(p,id,tr){const d=U[id];let s=d.c*1.2;if(p.estrat.tr.includes(d.o))s+=2.2;if(p.estrat.tr.includes(d.k))s+=2.2;
  const n=copias(p,id,1),n2=copias(p,id,2);s+=n>=2?7:n===1?2.5:0;if(n2>=2)s+=5;else if(n2===1)s+=1.5;return s;}
/* ativo da vocação do bot: gasta só se não perder juros (ou da fase 4 em diante / vida baixa); Paladin congela antes de comprar, Knight escolhe depois de montar o tabuleiro */
/* runas dos bots: compram quando não quebram a economia (juros preservados, ou a partir do estágio 4 com folga de 2 de ouro) e armam na hora (as de alvo, na unidade mais forte do tabuleiro) */
const BOT_RUNA={estLivre:4,folga:2};   // ajustes de balanceamento
function runaBot(G,p){const r=p.rl;if(!r)return;const R=RUNA[r.k],est=G.info.est;
  if(G.opt.semRunas||p.ouro<R.custo||runasTotal(p)>=RN.armMax)return;
  const juros=o=>Math.min(jurosMax(p),Math.floor(o/10));
  if(juros(p.ouro-R.custo)>=juros(p.ouro)||(est>=BOT_RUNA.estLivre&&p.ouro>=R.custo+BOT_RUNA.folga))execCmd(G,p,{t:'comprarRuna',i:r.i});}
function armarBot(G,p){let g=0;
  while(g++<RN.armMax+4&&p.mr.length&&p.ra.length<RN.armMax){const bi=p.mr.findIndex(k=>!p.ra.some(a=>a.k===k));if(bi<0)break;const k=p.mr[bi];let un;
    if(RUNA[k].alvo){let b=null,bs=-1;todos(p).forEach(L=>{if(L.onde!=='tab')return;const s=potUn(L.inst);if(s>bs){bs=s;b=L;}});if(!b){break;}un=locDe(b);}
    if(execCmd(G,p,{t:'armar',i:bi,un})!==null)break;}}
const BOT_PODER={estLivre:99,res_druid:true,res_knight:false,res_sorcerer:false,min_druid:2};   // min_*: estágio mínimo para o bot usar o ativo   // estLivre: estágio a partir do qual o bot ignora os juros (99 = nunca)   // ajustes de balanceamento
function poderBot(G,p,quando){const P=PODER[p.voc];if(!P||PODERES_OFF||p.podU||G.fase!=='prep'||G.info.est<(BOT_PODER['min_'+p.voc]||1))return;
  const juros=o=>Math.min(jurosMax(p),Math.floor(o/10)),ok=p.ouro>=P.custo&&(juros(p.ouro-P.custo)>=juros(p.ouro)||G.info.est>=BOT_PODER.estLivre||p.hp<45)&&(!BOT_PODER['res_'+p.voc]||p.ouro-P.custo>=(p._res||0));
  if(!ok)return;
  if(p.voc==='paladin'&&quando==='cedo'){let b=-1,bs=-9;p.loja.forEach((id,i)=>{if(!id||i===p.cong||p.ouro<precoLoja(p,i)-1)return;const s=ptsCompra(p,id)+rnd()*.01;if(s>bs){bs=s;b=i;}});
    if(b>=0)execCmd(G,p,{t:'poder',alvo:b});}
  else if(p.voc==='knight'&&quando==='tarde'){let b=null,bs=-1;todos(p).forEach(L=>{if(L.onde!=='tab')return;const s=potUn(L.inst);if(s>bs){bs=s;b=L;}});

/* fundo estático do tabuleiro (chão, grade, molduras, banco) desenhado uma vez numa tela fora da vista */

/* ---- barra acima da unidade: vida em divisões de 300 (tamanho do tanque), mana azul, estrelas; borda verde (aliado) ou vermelha (inimigo) ---- */
function desenharBarras(u,px,py,rt,alfa){const f=folhaDe(u.d),altura=f?Math.min(f.h,64):32,off=Math.min(Math.max(altura-30,0)*.55,15);

/* ---- ataque do avatar no fim da luta (o "pequeno herói" do TFT): só visual, ~1,5 s, pulável (clique no tabuleiro ou Espaço).

function criarAtaque(o){const A=o.atk,T=o.alvo,mag=o.mag,rd=UI.reduz;
  const dx=T.X-A.X,dy=T.Y-A.Y,dist=Math.max(1,Math.hypot(dx,dy));
  const frac=rd?0:(mag.perto?Math.max(0,1-27/dist):.42),ida=rd?0:(mag.perto?520:300);            // fração do caminho percorrida e duração da corrida

  return {b:performance.now(),A,T,mag,dano:o.dano||0,perdId:o.perdId,frac,ida,tc,md,th,tv,vol,te,dur:Math.max(te,th+1000),hit:false,somTc:false,mon:o.mon||null,dxy:[dx,dy]};}

function desenharAtaque(now){const a=UI.atq;if(!a)return;const t=now-a.b,A=a.A,T=a.T,mag=a.mag,pa=posAtaque(a,t);

/* ---- clímax da luta (só visual, lê C.t / C.tempoMax; não mexe no motor nem sorteia nada): barra de força das equipes e morte súbita ---- */
function desenharClimax(C,rt,now){
  const meu=ESP?1:0,w=244,x0=10,y0=5,h=13,rd=UI.reduz;   // barra à esquerda do botão Placar (que fica no canto superior direito)
  // barra "cabo de guerra": vida total viva (invocações incluídas) do seu time (azul) contra o inimigo (vermelho)
  let a=0,b=0;C.un.forEach(u=>{if(u.vivo)(u.lado===meu?(a+=u.hp):(b+=u.hp));});
  let F=UI.forca;if(!F||F.C!==C){F=UI.forca={C,a,b,ult:now,lid:0,vir:0,virLado:0,t0:now};}
  const dt=Math.min(100,now-F.ult);F.ult=now;const k=rd?1:1-Math.pow(.992,dt);F.a+=(a-F.a)*k;F.b+=(b-F.b)*k;   // anima suave (a luta continua no motor, aqui só o desenho alcança)
  const tot=F.a+F.b,fr=tot>0?clamp(F.a/tot,0,1):.5,lid=fr>.53?1:fr<.47?-1:0;
  if(lid&&F.lid&&lid!==F.lid&&now-F.t0>2500){F.vir=now;F.virLado=lid;}   // virada: quem lidera trocou
  if(lid)F.lid=lid;
  const vt=now-F.vir,flash=!rd&&F.vir&&vt<700?1-vt/700:0,tr=flash?Math.round(Math.sin(vt/35)*1.5*flash):0;
  // morte súbita ativa: vinheta e borda vermelhas ficam ATRÁS da barra de força

function acaoLocal(c){const p=UI.jog;if(!p)return false;

function voarCompra(el,L,dur){const r=el.getBoundingClientRect(),cr=cv.getBoundingClientRect();

  const g=document.createElement('div');g.className='voo';g.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;

  setTimeout(()=>g.remove(),dur+400);}

function hudAnaliseEspia(){const el=$('espia-analise'),q=G.jog[UI.espiar],un=UI.prev&&UI.prev.un||[];el.hidden=false;
  if(!un.length){el.innerHTML='<h3>Tabuleiro vazio</h3><p>Este jogador ainda não posicionou unidades.</p>';return;}
  const media=k=>Math.round(un.reduce((s,u)=>s+(k==='arm'?armEff(u):u[k]),0)/un.length);
  const roles={},els={};un.forEach(u=>{const k=PAPEL_CLASSE[u.d.k];if(k)roles[k]=(roles[k]||0)+1;elementosUnidade(u.d).forEach(e=>els[e]=(els[e]||0)+1);});
  const dicas=[];
  if(roles.invocador)dicas.push('Invocações: ondas e explosões podem atingir vários alvos.');
  if(un.some(u=>u.salta))dicas.push('Salto na retaguarda: proteja seus carries com posicionamento.');
  if(un.some(u=>u.queima))dicas.push('Queima de mana: habilidades podem demorar mais para sair.');
  if(un.some(u=>u.res.fire>0))dicas.push('Há proteção contra fogo. Considere outras fontes de dano.');
  if(un.some(u=>partesHab(u.d).some(h=>h.provoca)))dicas.push('Provocação: inimigos próximos podem ser forçados a atacar o tanque.');
  if(un.some(u=>partesHab(u.d).some(h=>h.deb&&h.deb.ferida)))dicas.push('Ferida: reduz a cura recebida; evite depender só de cura.');
  if(un.some(u=>partesHab(u.d).some(h=>h.deb&&h.deb.silencio)))dicas.push('Silêncio: pode atrasar habilidades, mas ataques básicos continuam.');
  if(roles.suporte)dicas.push('Cura no time: concentrar dano pode impedir que um alvo se recupere.');
  if(!dicas.length)dicas.push('Compare as defesas e ajuste seus itens e posicionamento.');
  el.innerHTML=`<h3>Leitura do adversário</h3><p class="analise-nome">${esc(q.nome)} · ${un.length} unidades no tabuleiro</p>

    <ul>${dicas.map(d=>`<li>${d}</li>`).join('')}</ul><small>Inclui itens e sinergias visíveis. A média não prevê o resultado da luta.</small>`;}

  if(lx>=BX&&lx<BX+NC*TS&&ly>=BY&&ly<BY+NR*TS){const x=Math.floor((lx-BX)/TS),y=Math.floor((ly-BY)/TS);return y>=4?{onde:'tab',x,y:y-4}:{onde:'inim',x,y};}

    if(P.some(p=>!p.dead))requestAnimationFrame(f);};
  requestAnimationFrame(f);}

function bencaoTecla(ev){if(!UI.bnAberta)return false;const k=ev.key.toLowerCase();
  if(UI.bnVer){if(k==='escape'){ev.preventDefault();bencaoVer(false);return true;}return false;}
  if(ev.target.closest&&ev.target.closest('button')&&(k===' '||k==='enter'))return true;      // deixa o botão focado agir
  if(k==='1'||k==='2'||k==='3'){ev.preventDefault();bencaoEscolher(+k-1);}
  else if(k==='r'){ev.preventDefault();bencaoRr();}
  else if(k==='escape'||k==='v'){ev.preventDefault();bencaoVer(true);}
  else if(k==='tab'){const els=[...$('bencao').querySelectorAll('button')].filter(e=>!e.disabled),first=els[0],last=els[els.length-1];
    if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}
  return true;}

/* ---------- transporte 1: PeerJS (WebRTC direto; sinalização pelo servidor público do PeerJS) ---------- */
function transPeer(){let peer=null,cons={},hc=null,morto=false;
  const T={nome:'PeerJS',
    hospedar(cod,cb){
      if(typeof Peer==='undefined'){cb.erro('A biblioteca PeerJS não carregou (sem internet?).');return;}
      peer=new Peer('tibiatactics-'+cod);
      peer.on('open',()=>cb.aberto());
      peer.on('error',e=>cb.erro(e&&e.type==='unavailable-id'?'ocupado':'Erro de rede: '+((e&&e.type)||e)));
      peer.on('connection',conn=>{const cid=conn.peer;
        conn.on('open',()=>{cons[cid]=conn;cb.conexao(cid);});
        conn.on('data',d=>{if(d&&typeof d==='object')cb.msg(cid,d);});
        conn.on('close',()=>{if(cons[cid]===conn){delete cons[cid];cb.saiu(cid);}});
        conn.on('error',()=>{});});},
    entrar(cod,cb){
      if(typeof Peer==='undefined'){cb.erro('A biblioteca PeerJS não carregou (sem internet?).');return;}
      peer=new Peer();let aberto=false;
      const to=setTimeout(()=>{if(!aberto&&!morto){cb.erro('Tempo esgotado: sala não encontrada.');T.fechar();}},15000);
      peer.on('error',e=>{if(!aberto&&!morto){clearTimeout(to);cb.erro(e&&e.type==='peer-unavailable'?'Sala não encontrada.':'Erro de rede: '+((e&&e.type)||e));}});
      peer.on('open',()=>{hc=peer.connect('tibiatactics-'+cod,{reliable:true,serialization:'json'});
        hc.on('open',()=>{aberto=true;clearTimeout(to);cb.aberto();});
        hc.on('data',d=>{if(d&&typeof d==='object')cb.msg(d);});
        hc.on('close',()=>{if(!morto&&aberto)cb.fechou();});
        hc.on('error',()=>{});});},
    paraCliente(cid,m){const c=cons[cid];if(c&&c.open)c.send(m);},
    paraHost(m){if(hc&&hc.open)hc.send(m);},
    expulsar(cid){const c=cons[cid];if(c){delete cons[cid];try{c.close();}catch(e){}}},
    fechar(){morto=true;try{if(peer)peer.destroy();}catch(e){}peer=null;cons={};hc=null;}};
  return T;}

/* ---------- transporte 2: BroadcastChannel (?rede=local): duas abas do mesmo navegador, sem internet ---------- */
function transLocal(){let bc=null,meu='',cons={},hb=null,ultHost=0,aberto=false,morto=false,oiT=null,to=null;
  const env=(para,m)=>{try{if(bc)bc.postMessage(JSON.stringify({de:meu,para,m}));}catch(e){}};
  const T={nome:'BroadcastChannel',
    hospedar(cod,cb){
      if(typeof BroadcastChannel==='undefined'){cb.erro('BroadcastChannel indisponível neste navegador.');return;}
      meu='H';bc=new BroadcastChannel('tibiatactics-'+cod);const tmp='?'+Math.random().toString(36).slice(2);let achou=false;
      bc.onmessage=ev=>{const d=jp(ev.data);if(!d||!d.m)return;const m=d.m;
        if(d.para===tmp&&m.t==='_ocupado'){achou=true;return;}
        if(!aberto)return;
        if(m.t==='_existe'){env(d.de,{t:'_ocupado'});return;}
        if(d.para!=='H')return;const cid=d.de;
        if(m.t==='_oi'){if(!cons[cid]){cons[cid]={ult:agoraMs()};cb.conexao(cid);}env(cid,{t:'_ok'});return;}
        const c=cons[cid];if(!c)return;c.ult=agoraMs();
        if(m.t==='_ping')return;if(m.t==='_tchau'){delete cons[cid];cb.saiu(cid);return;}
        cb.msg(cid,m);};
      bc.postMessage(JSON.stringify({de:tmp,para:'*',m:{t:'_existe'}}));
      setTimeout(()=>{if(morto)return;if(achou){cb.erro('ocupado');T.fechar();return;}aberto=true;cb.aberto();
        hb=setInterval(()=>{const ag=agoraMs();for(const cid of Object.keys(cons)){env(cid,{t:'_ping'});if(ag-cons[cid].ult>90000){delete cons[cid];cb.saiu(cid);}}},2000);},250);},
    entrar(cod,cb){
      if(typeof BroadcastChannel==='undefined'){cb.erro('BroadcastChannel indisponível neste navegador.');return;}
      meu='C'+Math.random().toString(36).slice(2,9);bc=new BroadcastChannel('tibiatactics-'+cod);
      bc.onmessage=ev=>{const d=jp(ev.data);if(!d||d.para!==meu||!d.m)return;const m=d.m;ultHost=agoraMs();
        if(m.t==='_ok'){if(aberto)return;aberto=true;clearInterval(oiT);clearTimeout(to);cb.aberto();
          hb=setInterval(()=>{env('H',{t:'_ping'});if(agoraMs()-ultHost>90000&&!morto){cb.fechou();T.fechar();}},2000);return;}
        if(m.t==='_ping')return;if(m.t==='_tchau'){const f=!morto;T.fechar();if(f)cb.fechou();return;}
        cb.msg(m);};
      const oi=()=>env('H',{t:'_oi'});oi();oiT=setInterval(oi,400);
      to=setTimeout(()=>{if(!aberto&&!morto){clearInterval(oiT);cb.erro('Sala não encontrada.');T.fechar();}},3500);},
    paraCliente(cid,m){env(cid,m);},
    paraHost(m){env('H',m);},
    expulsar(cid){if(cons[cid]){env(cid,{t:'_tchau'});delete cons[cid];}},
    fechar(){if(morto)return;morto=true;clearInterval(hb);clearInterval(oiT);clearTimeout(to);
      if(aberto||meu==='H'){if(meu==='H')Object.keys(cons).forEach(cid=>env(cid,{t:'_tchau'}));else env('H',{t:'_tchau'});}
      try{if(bc)bc.close();}catch(e){}bc=null;cons={};}};
  return T;}
const novoTransporte=()=>MODO_REDE==='local'?transLocal():transPeer();

/* tabuleiro público de um jogador (posições, estrelas e itens; nada da loja nem do ouro): [id,estrelas,x,y,itens|0] */
const tbSer=q=>{const o=[];q.tab.forEach((l,y)=>l.forEach((inst,x)=>{if(inst)o.push([inst.id,inst.e,x,y,inst.itens.length?inst.itens.slice():0]);}));return o;};

const snapPriv=p=>({ouro:p.ouro,xp:p.xp,nivel:p.nivel,hp:p.hp,seq:p.seq,travada:p.travada,podU:p.podU,podEsc:p.podEsc,podRuna:p.podRuna,cong:p.cong,vivo:p.vivo,colocacao:p.colocacao,banco:p.banco,tab:p.tab,itens:p.itens,loja:p.loja,renda:p.renda||null,drop:p.drop||null,nvitorias:p.nvitorias,pronto:!!p.pronto,bn:p.bn||[],ob:p.ob||null,rl:p.rl||null,mr:p.mr||[],ra:p.ra||[]});

  tempo:Math.max(0,Math.round(Online.prepFim-agoraMs())),tmax:UI.timerMax},extra||{});}

function onlineCriarSala(nome,voc,tent){tent=tent||0;onlineSair();const cod=novoCodigo();
  Online.ativo=true;Online.host=true;Online.codigo=cod;Online.nome=limparNome(nome);Online.voc=voc;Online.tr=novoTransporte();
  Online.sala=[{cid:null,nome:Online.nome,voc,host:true}];msgOnline('Criando sala...');
  Online.tr.hospedar(cod,{
    aberto(){mostrarLobby();},
    erro(m){if(m==='ocupado'&&tent<6){onlineCriarSala(nome,voc,tent+1);return;}onlineFalha(m==='ocupado'?'Não foi possível reservar um código de sala. Tente de novo.':m);},
    conexao(){},msg:hostMsg,saiu:hostSaiu});}
function lobbyEnviar(){const m={t:'lobby',cod:Online.codigo,jog:Online.sala.map(x=>({nome:x.nome,voc:x.voc,host:!!x.host}))};
  Online.sala.forEach(x=>{if(x.cid!==null)Online.tr.paraCliente(x.cid,m);});if(Online.tela==='lobby')mostrarLobby();}
function hostMsg(cid,m){if(!m||typeof m.t!=='string')return;
  if(m.t==='hello')return hostHello(cid,m);
  const cl=Online.clientes[cid];if(!cl)return;cl.ult=agoraMs();
  if(m.t==='cmd')return hostCmd(cl,m);
  if(m.t==='emote')return hostEmote(cl,m);
  if(m.t==='bye')return hostSaiu(cid);}
function hostHello(cid,m){const T=Online.tr;
  const recusa=txt=>{T.paraCliente(cid,{t:'recusa',motivo:txt});setTimeout(()=>T.expulsar(cid),400);};
  if(!m||m.v!==PROTO)return recusa('Versão do jogo diferente da do anfitrião: atualize a página (Ctrl+F5) e tente de novo.');
  let nome=limparNome(m.nome);const voc=VOCS.includes(m.voc)?m.voc:'knight',tk=String(m.tk||'');
  if(Online.emJogo){   // partida em andamento: só retoma a vaga de quem caiu (mesmo nome) ou do mesmo navegador (mesmo token)
    const chave=nome.toLowerCase();
    const velhoCid=Object.keys(Online.clientes).find(k=>k!==cid&&Online.clientes[k].p&&Online.clientes[k].p.nome.toLowerCase()===chave);
    let p=null;
    if(velhoCid){if(tk&&Online.clientes[velhoCid].tk===tk){p=Online.clientes[velhoCid].p;const antigo=velhoCid;delete Online.clientes[antigo];T.expulsar(antigo);}else return recusa('Já existe um jogador com esse nome na partida.');}
    else p=G.jog.find(q=>q.eraHumano&&!q.humano&&(q.nome.toLowerCase()===chave||(tk&&q.tk===tk)));
    if(!p)return recusa('Partida em andamento: não há vaga reservada para esse nome.');
    p.humano=true;p.remoto=true;p.cid=cid;p.pronto=false;p.tk=tk;
    const cl={cid,nome:p.nome,voc:p.voc,p,tk,ult:agoraMs(),ack:0,cnt:0,cntT:0};Online.clientes[cid]=cl;
    T.paraCliente(cid,{t:'ola',id:p.id,retomou:true});T.paraCliente(cid,{t:'inicio',id:p.id});
    enviarSnapCl(cl,'rodada',{opo:G.opoDe[p.id]===undefined?-1:G.opoDe[p.id],opoEq:G.opoEq[p.id]||[]});
    const f=G.lutas[p.id];if(G.fase==='combate'&&f)enviarLuta(cl,f);
    avisarTodos(p.nome+' voltou à partida');marcar('jog');return;}
  if(Online.sala.length>=8)return recusa('Sala cheia (8 jogadores).');
  const base=nome;let k=1;while(Online.sala.some(x=>x.nome.toLowerCase()===nome.toLowerCase()))nome=base.slice(0,13)+' '+(++k);
  Online.clientes[cid]={cid,nome,voc,p:null,tk,ult:agoraMs(),ack:0,cnt:0,cntT:0};Online.sala.push({cid,nome,voc,host:false});
  T.paraCliente(cid,{t:'ola',id:-1,nome});lobbyEnviar();}
function hostSaiu(cid){const cl=Online.clientes[cid];if(!cl)return;delete Online.clientes[cid];
  if(!Online.emJogo){Online.sala=Online.sala.filter(x=>x.cid!==cid);lobbyEnviar();return;}
  const p=cl.p;if(p&&p.cid===cid&&p.humano){virarBot(G,p);avisarTodos(p.nome+' saiu da partida: um bot assumiu a vaga');marcar('jog');
    if(UI.fase==='prep'&&G.info.tipo==='car')abrirCarrosselUI();}}

function hostCmd(cl,m){const p=cl.p;if(!p||!Online.emJogo||!m.c||!Number.isInteger(m.n))return;
  const ag=agoraMs();if(ag-cl.cntT>1000){cl.cntT=ag;cl.cnt=0;}if(++cl.cnt>80)return;     // limite de comandos por segundo
  cl.ack=m.n;

  iniciarPrepUI(true);}

Online.hostRodada=function(){Online.prepFim=agoraMs()+UI.timerMax*1000;Online.carOk=0;

function enviarLuta(cl,f){const p=cl.p;

/* relógio do anfitrião: roda por setInterval (não depende do requestAnimationFrame, que para em aba escondida) */
function hostFimPrep(timeout){const car=G.info.tipo==='car';

  a('cura',['magic_blue','green_rings']);a('sagrado',['holydamage','holyarea']);a('buff',['magic_red','magic_green']);

  const F=C.fx;for(let i=F.length-1;i>=0&&i>=F.length-90;i--){const e=F[i];if(e.s||e.b>rt+30)continue;e.s=1;if(rt-e.b>600)continue;const k=SOMFX[e.id];

  const T=C.tiros;for(let i=T.length-1;i>=0&&i>=T.length-30;i--){const m=T[i];if(m.s||m.b>rt+30)continue;m.s=1;if(rt-m.b>400)continue;const k=SOMTIRO[m.id]||'flecha';if(pode('t'+k,80))KS[k](.8);}
  const Fa=C.falas;for(let i=Fa.length-1;i>=0&&i>=Fa.length-10;i--){const f=Fa[i];if(f.s||f.b>rt+30)continue;f.s=1;if(rt-f.b>500)continue;if(pode('conj',140))KS.conjurar(.9);}}
const Sons={
  comprar(){tom(1568,1568,.12,'sine',.2);tom(2093,2093,.2,'sine',.18,.07);tom(3136,3136,.1,'triangle',.05,.07);},
  vender(){tom(2093,2093,.08,'sine',.16);tom(1568,1568,.12,'sine',.16,.06);tom(1175,1175,.18,'sine',.14,.12);},
  rolar(){[0,.05,.1,.16].forEach((a,i)=>ruidoSom(.07,.26,3000+i*2500,1500,1.2,'bandpass',a));},
  poder(v){const b={knight:[196,392],paladin:[523,1047],sorcerer:[262,131],druid:[392,784]}[v]||[392,784];tom(b[0],b[1],.28,v==='sorcerer'?'sawtooth':'triangle',.14);tom(b[1],b[1]*1.5,.22,'sine',.1,.08);ruidoSom(.25,.07,1500,6000,2,'highpass',.05);},
  bencao(t){[0,1,2].slice(0,t+2).forEach((i)=>tom(523*Math.pow(1.26,i+t),523*Math.pow(1.26,i+t),.5,'triangle',.12,i*.11));tom(1568+t*300,1568+t*300,.7,'sine',.09,.3);ruidoSom(.35,.05,3000,9000,2,'highpass',.1);},
  bencaoEscolha(t){[392,523,659,784].forEach((f,i)=>tom(f*(1+t*.12),f*(1+t*.12),.35,'triangle',.14,i*.07));tom(1568,1568,.5,'sine',.1,.28);ruidoSom(.3,.07,2000,8000,2,'highpass',.12);},
  xp(){tom(440,880,.16,'triangle',.16);tom(660,1320,.16,'triangle',.1,.06);},
  nivel(){[392,494,587,784].forEach((f,i)=>tom(f,f,.3,'triangle',.18,i*.08));tom(1568,1568,.4,'sine',.1,.3);},
  fundir(){[523,659,784,988,1319,1568].forEach((f,i)=>tom(f,f,.5,'sine',.12,i*.06));ruidoSom(.5,.12,2000,8000,2,'highpass');},
  equipar(){tom(330,660,.1,'triangle',.14);tom(990,990,.12,'sine',.1,.08);},
  combinar(){tom(523,784,.09,'triangle',.14);tom(1047,1568,.16,'sine',.12,.07);},
  forja(){ruidoSom(.18,.2,700,2500,2,'bandpass');[392,523,659,880,1175].forEach((f,i)=>tom(f,f,.4,'triangle',.11,.12+i*.06));tom(1760,1760,.5,'sine',.08,.45);},
  encanta(){[784,988,1175,1568].forEach((f,i)=>tom(f,f*1.01,.35,'sine',.1,i*.07));ruidoSom(.3,.08,3000,9000,2,'highpass',.1);},
  pegar(){tom(660,880,.05,'triangle',.06);},
  emote(){tom(900,1200,.07,'sine',.08);},
  intro(){tom(90,45,.55,'sine',.55);ruidoSom(.55,.28,300,3000,.7,'lowpass');},
  vitoria(){[[392,0],[523,.14],[659,.28],[784,.42]].forEach(([f,a])=>{tom(f,f,.5,'square',.08,a);tom(f*2,f*2,.5,'triangle',.08,a);});tom(1047,1047,.8,'triangle',.13,.56);},
  derrota(){[[392,0],[349,.2],[311,.4],[220,.62]].forEach(([f,a])=>tom(f,f*.97,.55,'sawtooth',.09,a));},

/* música ambiente simples (opcional, desligada por padrão): drone + arpejo em ré menor, com eco */
let musT=null,musN=0,musProx=0,musNos=null;
const SEMI=s=>146.83*Math.pow(2,s/12);
const ACORDES=[[0,3,7,12],[8,12,15,20],[10,14,17,22],[7,10,14,19]];
function musicaLigar(){if(!Som.ok||musT)return;const c=Som.ctx;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(Som.gu);
  const dl=c.createDelay(1);dl.delayTime.value=.37;const fb=c.createGain();fb.gain.value=.38;const wet=c.createGain();wet.gain.value=.45;lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(Som.gu);
  const dr=c.createGain();dr.gain.value=.05;const dlp=c.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=260;dr.connect(dlp);dlp.connect(Som.gu);
  const oscs=[73.42,110.0,73.9].map((f,i)=>{const o=c.createOscillator();o.type=i<2?'sawtooth':'triangle';o.frequency.value=f;o.connect(dr);o.start();return o;});
  const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.12;lg.gain.value=.025;lfo.connect(lg);lg.connect(dr.gain);lfo.start();
  musNos={lp,oscs,lfo,dr};musProx=c.currentTime+.3;musN=0;musT=setInterval(musicaTick,200);}
function musicaDesligar(){clearInterval(musT);musT=null;if(musNos){try{musNos.oscs.forEach(o=>o.stop());musNos.lfo.stop();musNos.lp.disconnect();musNos.dr.disconnect();}catch(e){}musNos=null;}}
function musicaTick(){if(!Som.ok||!musNos)return;const c=Som.ctx;
  while(musProx<c.currentTime+.8){const ac=ACORDES[Math.floor(musN/16)%4],p=[0,1,2,1,3,2,1,2][musN%8],at=musProx-c.currentTime;
    if(Math.random()<.82)tom(SEMI(ac[p]),0,.55,'triangle',.16,at,musNos.lp);
    if(musN%8===0)tom(SEMI(ac[0]-12),0,1.3,'sine',.2,at,musNos.lp);
    if(musN%16===10&&Math.random()<.7)tom(SEMI(ac[2]+12),0,.9,'sine',.07,at,musNos.lp);
    musProx+=.36;musN++;}}
/* painel de opções */

/* impacto: pequeno tremor da tela e congelamento de ~80 ms (habilidade de custo 5, crítico grande, morte da última unidade) */
function impactoUI(k,now){if(UI.reduz||UI.demo)return;if(k!=='final'&&now-(UI.impT||0)<700)return;UI.impT=now;
  const d={hab5:[300,3.2],crit:[220,2.2],final:[440,5]}[k]||[220,2];UI.shake={b:now,dur:d[0],amp:d[1]};UI.freezeAte=now+(k==='final'?150:80);if(k==='final')UI.lentoAte=now+150+450;}   // último golpe: congela e depois câmera lenta (~450 ms a 30%)
function laco(ts){requestAnimationFrame(laco);const dt=Math.min(100,ts-(UI.ultT||ts));UI.ultT=ts;const now=performance.now();
  const pausa=UI.pausado&&!Online.ativo;       // online não pausa
  if(UI.intro&&now>=UI.intro)fecharIntro();
  const espera=now<UI.intro||now<UI.freezeAte;   // entrada da luta e congelamento de impacto: só o motor visual espera (o relógio do anfitrião é por setInterval)
  if(UI.C&&!pausa&&(UI.demo||UI.estado==='jogo'&&UI.fase==='combate')){
    if(!espera){UI.acc=Math.min(UI.acc+dt*(UI.demo?.7:UI.vel)*(now<(UI.lentoAte||0)?.3:1),500);while(UI.acc>=100&&!UI.C.fim){passo(UI.C);UI.acc-=100;}}
    if(!UI.demo){const I=UI.C.imp;while(UI.impIdx<I.length){impactoUI(I[UI.impIdx++].k,now);}somCombate(UI.C,UI.C.t+UI.acc);somClimax(UI.C,UI.C.t+UI.acc);}
    if(UI.C.fim&&!UI.demo&&UI.C.venc===(UI.C.esp?1:0)&&(!UI.celebra||UI.celebra.C!==UI.C))UI.celebra={C:UI.C,b:now};   // sobreviventes comemoram (só visual)
    if(UI.C.fim){UI.acc=0;UI.fimEm+=dt;if(UI.demo){if(UI.fimEm>2500)iniciarDemo();}else if(UI.fimEm>1500&&!Online.ativo)finalizarRodadaUI();}}
  else if(UI.estado==='jogo'&&!pausa){
    if(UI.fase==='prep'&&Online.host){}      // o relógio do anfitrião roda em tiqueHost (setInterval)
    else if(UI.fase==='prep'){if(!bnPausaTimer())UI.timer-=dt/1000;if(UI.timer<=0&&Online.guest)UI.timer=0;else if(UI.timer<=0){if(G.info.tipo==='car'&&!carPronto(G)){let bi=0,bs=-1;G.car.itens.forEach((id,i)=>{if(tierCar(id)>bs){bs=tierCar(id);bi=i;}});carEscolher(G,bi);fecharTela();marcar('itens');}pronto(true);}}
    else if(UI.fase==='resultado'&&!Online.host){UI.resEm-=dt;if(UI.resEm<=0){UI.fase='fila';proximaRodadaUI();}}}
  if(UI.estado==='jogo'){atualizarSujos();hudTempo();sincCombate();
    if(UI.fase==='prep'&&G&&G.info.tipo!=='car'){const n=Math.ceil(UI.timer);if(n!==UI.tk){UI.tk=n;if(n>=1&&n<=5)Sons.tique(n);}}}
  // tremor da tela (só no canvas do tabuleiro)
  if(UI.shake&&now<UI.shake.b+UI.shake.dur){const a=UI.shake.amp*(1-(now-UI.shake.b)/UI.shake.dur);cv.style.transform=`translate(${((Math.random()-.5)*2*a).toFixed(1)}px,${((Math.random()-.5)*2*a).toFixed(1)}px)`;}
  else if(cv.style.transform)cv.style.transform='';
  if(UI.meterAberto&&ts-(UI.ultMeter||0)>250){UI.ultMeter=ts;hudMeter();}
  // retratos animados das cartas
  // retratos das cartas: andam para o leste (mais rápido com o mouse em cima)
  if((UI.estado==='jogo'||$('tela').querySelector('.novas-cartas'))&&ts-(UI.ultRet||0)>40){UI.ultRet=ts;document.querySelectorAll('#cartas canvas[data-and],.novas-cartas canvas[data-and]').forEach(c=>pintarAndar(c,c.dataset.and,ts+(+c.dataset.k||0)*137,+c.dataset.k===UI.hoverCartaI));}
  const arr=!!UI.drag;if(arr!==UI._arr){UI._arr=arr;document.body.classList.toggle('arrastando',arr);}      // arrastando uma unidade: as cartas não levantam
  if(UI.atq)passoAtaque(now);
  if(UI.estado==='menu'&&ts-(UI.ultHer||0)>100){UI.ultHer=ts;pintarHeroiAnim(ts);}
  render();}
